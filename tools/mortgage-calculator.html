<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Calculator — Monthly Payment & Amortization | ToolPile</title>
<meta name="description" content="Free mortgage calculator. Calculate monthly payments, total interest, and see a full amortization schedule. Compare loan scenarios instantly.">
<meta name="keywords" content="mortgage calculator, home loan calculator, monthly payment calculator, amortization schedule, mortgage rate calculator">
<meta property="og:title" content="Mortgage Calculator — Free Monthly Payment Calculator">
<meta property="og:description" content="Calculate your monthly mortgage payment and see the full amortization breakdown. Free, instant, no signup.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/mortgage-calculator">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
label{display:block;font-size:.875rem;color:#94a3b8;margin-bottom:.5rem}
input,select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.75rem 1rem;color:#e2e8f0;font-size:1rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
.btn{border:none;border-radius:10px;padding:.85rem 1.5rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.3)}
.row{display:flex;gap:1rem;margin-bottom:1rem}
.row > *{flex:1}
.field{margin-bottom:1rem}
.grid{margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.25rem;text-align:center}
.card-label{font-size:.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.card-value{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card-sub{font-size:.75rem;color:#64748b;margin-top:.25rem}
table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.8rem}
th{background:#0f172a;color:#94a3b8;padding:.6rem .5rem;text-align:right;border-bottom:1px solid #334155;font-weight:600}
th:first-child{text-align:left}
td{padding:.5rem;text-align:right;border-bottom:1px solid #1e293b;color:#cbd5e1}
td:first-child{text-align:left;color:#94a3b8}
.amort-wrap{max-height:400px;overflow-y:auto;margin-top:1.5rem;border:1px solid #334155;border-radius:10px}
.amort-wrap::-webkit-scrollbar{width:6px}
.amort-wrap::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.chart-wrap{margin-top:1.5rem;text-align:center}
.pie{width:200px;height:200px;border-radius:50%;margin:0 auto 1rem}
.legend{display:flex;justify-content:center;gap:1.5rem;font-size:.8rem}
.legend span{display:flex;align-items:center;gap:.4rem}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
@media(max-width:500px){.row{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Mortgage Calculator</h1>
<p class="subtitle">Calculate monthly payments and view amortization schedule</p>
<div class="tool-area">
<div class="row">
<div class="field"><label>Home Price ($)</label><input type="number" id="price" value="350000" min="0" step="1000"></div>
<div class="field"><label>Down Payment ($)</label><input type="number" id="down" value="70000" min="0" step="1000"></div>
</div>
<div class="row">
<div class="field"><label>Interest Rate (%)</label><input type="number" id="rate" value="6.5" min="0" max="30" step="0.125"></div>
<div class="field"><label>Loan Term (years)</label><select id="term"><option value="30" selected>30 years</option><option value="20">20 years</option><option value="15">15 years</option><option value="10">10 years</option></select></div>
</div>
<div class="row">
<div class="field"><label>Property Tax ($/yr)</label><input type="number" id="tax" value="4200" min="0" step="100"></div>
<div class="field"><label>Insurance ($/yr)</label><input type="number" id="ins" value="1200" min="0" step="100"></div>
</div>
<button class="btn" onclick="calc()">Calculate</button>
<div id="results" style="display:none">
<div class="grid">
<div class="card"><div class="card-label">Monthly Payment</div><div class="card-value" id="monthly"></div><div class="card-sub" id="monthlyBreak"></div></div>
<div class="card"><div class="card-label">Total Interest</div><div class="card-value" id="totalInt"></div><div class="card-sub" id="totalPaid"></div></div>
<div class="card"><div class="card-label">Loan Amount</div><div class="card-value" id="loanAmt"></div><div class="card-sub" id="downPct"></div></div>
<div class="card"><div class="card-label">Payoff Date</div><div class="card-value" id="payoff"></div><div class="card-sub" id="totalMonths"></div></div>
</div>
<div class="chart-wrap">
<div class="pie" id="pie"></div>
<div class="legend"><span><span class="dot" style="background:#6366f1"></span> Principal</span><span><span class="dot" style="background:#38bdf8"></span> Interest</span><span><span class="dot" style="background:#f59e0b"></span> Tax &amp; Insurance</span></div>
</div>
<div class="amort-wrap">
<table>
<thead><tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
<tbody id="amortBody"></tbody>
</table>
</div>
</div>
</div>
</div>

<div style="margin-top:2rem;padding:1.25rem;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,35,.04));border:1px solid rgba(245,158,11,.25);border-radius:12px;text-align:center">
<div style="font-size:.7rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">Pro</div>
<div style="color:#e2e8f0;font-weight:600;font-size:.95rem;margin-bottom:.4rem">Need batch processing or export history?</div>
<a href="https://buy.stripe.com/8x25kCb76a8C7Sv33gfjG00" style="display:inline-block;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;border-radius:8px;padding:.55rem 1.5rem;font-size:.85rem;font-weight:700;text-decoration:none;margin-top:.25rem" onclick="typeof gtag!=='undefined'&&gtag('event','begin_checkout',{currency:'USD',items:[{item_name:'toolpile_pro'}]})">Upgrade to Pro — $4.99/mo</a>
</div>

<footer><a href="/">← Back to ToolPile</a></footer>
<script>
const fmt=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
function calc(){
const P=+document.getElementById('price').value-+document.getElementById('down').value;
const r=(+document.getElementById('rate').value/100)/12;
const n=+document.getElementById('term').value*12;
const tax=+document.getElementById('tax').value/12;
const ins=+document.getElementById('ins').value/12;
if(P<=0||r<=0||n<=0)return;
const M=P*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
const totalPay=M*n;
const totalInt=totalPay-P;
document.getElementById('monthly').textContent=fmt(M+tax+ins);
document.getElementById('monthlyBreak').textContent=`P&I: ${fmt(M)} | T&I: ${fmt(tax+ins)}`;
document.getElementById('totalInt').textContent=fmt(totalInt);
document.getElementById('totalPaid').textContent=`Total paid: ${fmt(totalPay+((tax+ins)*n))}`;
document.getElementById('loanAmt').textContent=fmt(P);
const dp=+document.getElementById('down').value;
const price=+document.getElementById('price').value;
document.getElementById('downPct').textContent=`${((dp/price)*100).toFixed(1)}% down`;
const payoff=new Date();
payoff.setMonth(payoff.getMonth()+n);
document.getElementById('payoff').textContent=payoff.toLocaleDateString('en-US',{month:'short',year:'numeric'});
document.getElementById('totalMonths').textContent=n+' months';
// pie chart
const totalAll=totalPay+(tax+ins)*n;
const pPct=(P/totalAll)*360;
const iPct=(totalInt/totalAll)*360;
document.getElementById('pie').style.background=`conic-gradient(#6366f1 0deg ${pPct}deg,#38bdf8 ${pPct}deg ${pPct+iPct}deg,#f59e0b ${pPct+iPct}deg 360deg)`;
// amortization
let bal=P;const tbody=document.getElementById('amortBody');tbody.innerHTML='';
const years=n/12;
for(let y=1;y<=years;y++){
let yp=0,yi=0;
for(let m=0;m<12&&bal>0;m++){
const intPay=bal*r;
const prinPay=Math.min(M-intPay,bal);
yi+=intPay;yp+=prinPay;bal-=prinPay;
}
tbody.innerHTML+=`<tr><td>${y}</td><td>${fmt(yp)}</td><td>${fmt(yi)}</td><td>${fmt(Math.max(bal,0))}</td></tr>`;
}
document.getElementById('results').style.display='block';
}
calc();
</script>
</body>
</html>
