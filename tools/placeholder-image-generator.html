<body>
<div class="container">
<h1>Placeholder Image Generator</h1>
<p class="subtitle">Generate placeholder images with custom dimensions, colors, and text. Download as PNG.</p>
<div class="tool-area">
<div class="controls">
<div><label>Width (px)</label><input type="number" id="imgW" value="800" min="10" max="4000" oninput="generate()"></div>
<div><label>Height (px)</label><input type="number" id="imgH" value="400" min="10" max="4000" oninput="generate()"></div>
<div><label>Background Color</label><div style="display:flex;gap:.5rem;align-items:center"><input type="color" id="bgColor" value="#334155" oninput="generate()"><span id="bgHex" style="font-size:.8rem;color:#64748b">#334155</span></div></div>
<div><label>Text Color</label><div style="display:flex;gap:.5rem;align-items:center"><input type="color" id="txtColor" value="#94a3b8" oninput="generate()"><span id="txtHex" style="font-size:.8rem;color:#64748b">#94a3b8</span></div></div>
<div><label>Text (leave empty for dimensions)</label><input type="text" id="imgText" placeholder="e.g. Logo Here" oninput="generate()"></div>
<div><label>Font Size (auto if 0)</label><input type="number" id="fontSize" value="0" min="0" max="200" oninput="generate()"></div>
</div>
<div class="presets">
<button onclick="setPreset(1200,630)">OG Image</button>
<button onclick="setPreset(1080,1080)">Instagram</button>
<button onclick="setPreset(1920,1080)">1080p</button>
<button onclick="setPreset(800,600)">4:3</button>
<button onclick="setPreset(300,250)">Ad Banner</button>
<button onclick="setPreset(150,150)">Avatar</button>
<button onclick="setPreset(728,90)">Leaderboard</button>
</div>
<div class="preview-wrap"><canvas id="canvas"></canvas></div>
<div class="actions">
<button onclick="download()">⬇ Download PNG</button>
<button class="btn-sm" onclick="copyDataURL()">Copy Data URL</button>
</div>
</div>

<div style="margin-top:2rem;padding:1.25rem;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,35,.04));border:1px solid rgba(245,158,11,.25);border-radius:12px;text-align:center">

<script>
function generate(){
const w=Math.max(10,Math.min(4000,+document.getElementById('imgW').value||800));
const h=Math.max(10,Math.min(4000,+document.getElementById('imgH').value||400));
const bg=document.getElementById('bgColor').value;
const tc=document.getElementById('txtColor').value;
const text=document.getElementById('imgText').value||w+'×'+h;
const fsInput=+document.getElementById('fontSize').value;
document.getElementById('bgHex').textContent=bg;
document.getElementById('txtHex').textContent=tc;
const canvas=document.getElementById('canvas');
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
// Draw crosshatch pattern
ctx.strokeStyle=tc;ctx.globalAlpha=0.08;ctx.lineWidth=1;
for(let i=-Math.max(w,h);i<Math.max(w,h)*2;i+=30){
ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+h,h);ctx.stroke();
}
ctx.globalAlpha=1;
// Draw border
ctx.strokeStyle=tc;ctx.globalAlpha=0.2;ctx.lineWidth=2;
ctx.strokeRect(1,1,w-2,h-2);ctx.globalAlpha=1;
// Draw text
const fs=fsInput>0?fsInput:Math.max(14,Math.min(w/8,h/4,72));
ctx.font='bold '+fs+'px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';
ctx.fillStyle=tc;ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText(text,w/2,h/2,w-20);
}
function download(){
const canvas=document.getElementById('canvas');
const a=document.createElement('a');
a.download='placeholder-'+canvas.width+'x'+canvas.height+'.png';
a.href=canvas.toDataURL('image/png');a.click();
}
function copyDataURL(){
const url=document.getElementById('canvas').toDataURL('image/png');
navigator.clipboard.writeText(url);
}
function setPreset(w,h){
document.getElementById('imgW').value=w;
document.getElementById('imgH').value=h;
generate();
}
generate();
</script>
