<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.65rem 1.25rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:transform .1s}
button:hover{transform:translateY(-1px)}
button.outline{background:transparent;border:1px solid #475569;color:#94a3b8}
label{font-size:.8rem;color:#94a3b8;display:block;margin-bottom:.3rem;margin-top:.75rem}
.drop-zone{border:2px dashed #475569;border-radius:12px;padding:2.5rem;text-align:center;cursor:pointer;transition:border-color .2s;color:#94a3b8}
.drop-zone:hover,.drop-zone.over{border-color:#818cf8;color:#818cf8}
.drop-zone .icon{font-size:2.5rem;margin-bottom:.5rem}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:.5rem;margin-top:1rem}
.filter-card{text-align:center;cursor:pointer;border:2px solid transparent;border-radius:8px;padding:.3rem;transition:border-color .2s}
.filter-card.active{border-color:#818cf8}
.filter-card canvas{width:80px;height:60px;border-radius:6px;display:block;margin:0 auto}
.filter-card .name{font-size:.7rem;color:#94a3b8;margin-top:.25rem}
.filter-card.active .name{color:#818cf8}
.section{margin-top:1.5rem;padding-top:1rem;border-top:1px solid #334155}
.section-title{font-size:1rem;font-weight:700;color:#818cf8;margin-bottom:.75rem}
.slider-row{display:flex;align-items:center;gap:.5rem;margin:.4rem 0}
.slider-row label{margin:0;min-width:80px;font-size:.8rem}
.slider-row input{flex:1;accent-color:#818cf8}
.slider-row .val{min-width:2.5rem;text-align:right;font-size:.8rem;color:#38bdf8;font-family:monospace}
.canvas-wrap{text-align:center;margin-top:1rem}
#mainCanvas{max-width:100%;border-radius:8px;border:1px solid #334155}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Photo Filter</h1>
<p class="subtitle">Apply Instagram-style filters to your photos. Adjust brightness, contrast, saturation and more.</p>
<div class="tool-area">
<div class="drop-zone" id="dropzone" onclick="document.getElementById('fileIn').click()">
<div class="icon">📸</div>
<p><strong>Drop your photo here</strong> or click to browse</p>
</div>
<input type="file" id="fileIn" accept="image/*" style="display:none">
<div id="editor" style="display:none">
<div class="section">
<div class="section-title">Filters</div>
<div class="filters" id="filterGrid"></div>
</div>
<div class="section">
<div class="section-title">Adjustments</div>
<div class="slider-row"><label>Brightness</label><input type="range" id="brightness" min="0" max="200" value="100" oninput="adj()"><div class="val" id="brightnessV">100</div></div>
<div class="slider-row"><label>Contrast</label><input type="range" id="contrast" min="0" max="200" value="100" oninput="adj()"><div class="val" id="contrastV">100</div></div>
<div class="slider-row"><label>Saturation</label><input type="range" id="saturate" min="0" max="200" value="100" oninput="adj()"><div class="val" id="saturateV">100</div></div>
<div class="slider-row"><label>Hue Rotate</label><input type="range" id="hue" min="0" max="360" value="0" oninput="adj()"><div class="val" id="hueV">0°</div></div>
<div class="slider-row"><label>Blur</label><input type="range" id="blur" min="0" max="20" value="0" step="0.5" oninput="adj()"><div class="val" id="blurV">0</div></div>
<div class="slider-row"><label>Sepia</label><input type="range" id="sepia" min="0" max="100" value="0" oninput="adj()"><div class="val" id="sepiaV">0</div></div>
<div class="slider-row"><label>Grayscale</label><input type="range" id="grayscale" min="0" max="100" value="0" oninput="adj()"><div class="val" id="grayscaleV">0</div></div>
</div>
<div class="canvas-wrap"><canvas id="mainCanvas" width="600" height="400"></canvas></div>
<div class="btn-row">
<button onclick="download()">Download</button>
<button class="outline" onclick="resetAdj()">Reset Adjustments</button>
</div>
</div>
</div>
</div>

<div style="margin-top:2rem;padding:1.25rem;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,35,.04));border:1px solid rgba(245,158,11,.25);border-radius:12px;text-align:center">
<div style="font-size:.7rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">Pro</div>
<div style="color:#e2e8f0;font-weight:600;font-size:.95rem;margin-bottom:.4rem">Need batch processing or export history?</div>
<a href="https://buy.stripe.com/8x25kCb76a8C7Sv33gfjG00" style="display:inline-block;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;border-radius:8px;padding:.55rem 1.5rem;font-size:.85rem;font-weight:700;text-decoration:none;margin-top:.25rem" onclick="typeof gtag!=='undefined'&&gtag('event','begin_checkout',{currency:'USD',items:[{item_name:'toolpile_pro'}]})">Upgrade to Pro — $4.99/mo</a>
</div>

<footer><a href="/">← Back to ToolPile</a></footer>
<script>
let img=null;
const FILTERS=[
  {name:'Normal',brightness:100,contrast:100,saturate:100,hue:0,blur:0,sepia:0,grayscale:0},
  {name:'Clarendon',brightness:110,contrast:130,saturate:120,hue:0,blur:0,sepia:0,grayscale:0},
  {name:'Gingham',brightness:105,contrast:90,saturate:85,hue:0,blur:0,sepia:0,grayscale:0},
  {name:'Moon',brightness:110,contrast:110,saturate:0,hue:0,blur:0,sepia:0,grayscale:100},
  {name:'Lark',brightness:110,contrast:90,saturate:115,hue:0,blur:0,sepia:0,grayscale:0},
  {name:'Reyes',brightness:110,contrast:85,saturate:75,hue:0,blur:0,sepia:22,grayscale:0},
  {name:'Juno',brightness:100,contrast:120,saturate:140,hue:0,blur:0,sepia:0,grayscale:0},
  {name:'Slumber',brightness:105,contrast:90,saturate:80,hue:0,blur:0,sepia:15,grayscale:0},
  {name:'Crema',brightness:105,contrast:95,saturate:90,hue:0,blur:0,sepia:12,grayscale:0},
  {name:'Ludwig',brightness:100,contrast:105,saturate:110,hue:0,blur:0,sepia:5,grayscale:0},
  {name:'Aden',brightness:115,contrast:85,saturate:85,hue:20,blur:0,sepia:20,grayscale:0},
  {name:'Perpetua',brightness:105,contrast:95,saturate:105,hue:0,blur:0,sepia:0,grayscale:0},
  {name:'Vintage',brightness:100,contrast:90,saturate:70,hue:0,blur:0,sepia:40,grayscale:0},
  {name:'Drama',brightness:90,contrast:150,saturate:110,hue:0,blur:0,sepia:0,grayscale:0},
  {name:'Fade',brightness:110,contrast:80,saturate:70,hue:0,blur:0,sepia:10,grayscale:0},
  {name:'Cool',brightness:100,contrast:105,saturate:90,hue:200,blur:0,sepia:0,grayscale:0},
];
let activeFilter=0;
const dz=document.getElementById('dropzone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])loadImg(e.dataTransfer.files[0])});
document.getElementById('fileIn').addEventListener('change',e=>{if(e.target.files[0])loadImg(e.target.files[0])});
function loadImg(file){
  const r=new FileReader();
  r.onload=ev=>{
    img=new Image();
    img.onload=()=>{
      document.getElementById('mainCanvas').width=img.width;
      document.getElementById('mainCanvas').height=img.height;
      dz.style.display='none';
      document.getElementById('editor').style.display='';
      buildFilterGrid();
      applyFilter(0);
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}
function buildFilterGrid(){
  const grid=document.getElementById('filterGrid');
  grid.innerHTML='';
  FILTERS.forEach((f,i)=>{
    const card=document.createElement('div');
    card.className='filter-card'+(i===0?' active':'');
    const c=document.createElement('canvas');c.width=80;c.height=60;
    const ctx=c.getContext('2d');
    ctx.filter=makeFilter(f);
    ctx.drawImage(img,0,0,80,60);
    card.appendChild(c);
    const name=document.createElement('div');name.className='name';name.textContent=f.name;
    card.appendChild(name);
    card.onclick=()=>applyFilter(i);
    grid.appendChild(card);
  });
}
function makeFilter(f){
  return `brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturate}%) hue-rotate(${f.hue}deg) blur(${f.blur}px) sepia(${f.sepia}%) grayscale(${f.grayscale}%)`;
}
function applyFilter(i){
  activeFilter=i;
  const f=FILTERS[i];
  document.getElementById('brightness').value=f.brightness;
  document.getElementById('contrast').value=f.contrast;
  document.getElementById('saturate').value=f.saturate;
  document.getElementById('hue').value=f.hue;
  document.getElementById('blur').value=f.blur;
  document.getElementById('sepia').value=f.sepia;
  document.getElementById('grayscale').value=f.grayscale;
  document.querySelectorAll('.filter-card').forEach((c,j)=>c.classList.toggle('active',j===i));
  adj();
}
function adj(){
  if(!img)return;
  const vals={
    brightness:document.getElementById('brightness').value,
    contrast:document.getElementById('contrast').value,
    saturate:document.getElementById('saturate').value,
    hue:document.getElementById('hue').value,
    blur:document.getElementById('blur').value,
    sepia:document.getElementById('sepia').value,
    grayscale:document.getElementById('grayscale').value
  };
  document.getElementById('brightnessV').textContent=vals.brightness;
  document.getElementById('contrastV').textContent=vals.contrast;
  document.getElementById('saturateV').textContent=vals.saturate;
  document.getElementById('hueV').textContent=vals.hue+'°';
  document.getElementById('blurV').textContent=vals.blur;
  document.getElementById('sepiaV').textContent=vals.sepia;
  document.getElementById('grayscaleV').textContent=vals.grayscale;
  const canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d');
  ctx.filter=`brightness(${vals.brightness}%) contrast(${vals.contrast}%) saturate(${vals.saturate}%) hue-rotate(${vals.hue}deg) blur(${vals.blur}px) sepia(${vals.sepia}%) grayscale(${vals.grayscale}%)`;
  ctx.drawImage(img,0,0);
}
function resetAdj(){applyFilter(0)}
function download(){
  const a=document.createElement('a');a.download='filtered-photo.png';a.href=document.getElementById('mainCanvas').toDataURL('image/png');a.click();
}
</script>
</body>
</html>
