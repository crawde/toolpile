<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
textarea,input[type="text"],input[type="number"],select{width:100%;background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;color:#e2e8f0;font-size:1rem;font-family:inherit;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
textarea{min-height:120px}
.output{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;margin-top:1rem;min-height:60px;color:#38bdf8;font-family:'JetBrains Mono',monospace,monospace;white-space:pre-wrap;word-break:break-all}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.75rem;transition:transform .1s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.btn-secondary{background:#334155;margin-left:.5rem}
.stats{display:flex;gap:1.5rem;margin-top:1rem;flex-wrap:wrap}
.stat{background:#1e293b;border-radius:8px;padding:.75rem 1rem;border:1px solid #334155;text-align:center;flex:1;min-width:100px}
.stat-value{font-size:1.5rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:.75rem;color:#94a3b8;margin-top:.25rem}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
.row{display:flex;gap:.75rem;align-items:center;margin-top:.75rem;flex-wrap:wrap}
label{font-size:.875rem;color:#94a3b8;display:block;margin-bottom:.5rem;margin-top:1rem}
.preview{width:100%;height:80px;border-radius:8px;border:1px solid #475569;margin-top:1rem}
.palette{display:flex;gap:.5rem;margin-top:1rem}
.swatch{flex:1;height:50px;border-radius:6px;cursor:pointer;border:1px solid #475569;position:relative}
.swatch:hover::after{content:attr(data-hex);position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.7rem;color:#94a3b8;white-space:nowrap}
</style>
</head>
<body>
<div class="container">
<h1>HEX Color Picker</h1>
<p class="subtitle">Pick a color and get HEX, RGB &amp; HSL values — plus complementary palette</p>
<div class="tool-area">
<label>Pick a color</label>
<input type="color" id="picker" value="#6366f1" style="width:100%;height:50px;border:none;border-radius:8px;cursor:pointer;background:none" oninput="update(this.value)">
<div class="preview" id="preview" style="background:#6366f1"></div>
<div class="stats">
<div class="stat"><div class="stat-value" id="hex" style="font-size:1rem;cursor:pointer" onclick="navigator.clipboard.writeText(this.textContent)">#6366F1</div><div class="stat-label">HEX (click to copy)</div></div>
<div class="stat"><div class="stat-value" id="rgb" style="font-size:1rem;cursor:pointer" onclick="navigator.clipboard.writeText(this.textContent)">99, 102, 241</div><div class="stat-label">RGB</div></div>
<div class="stat"><div class="stat-value" id="hsl" style="font-size:1rem;cursor:pointer" onclick="navigator.clipboard.writeText(this.textContent)">239°, 84%, 67%</div><div class="stat-label">HSL</div></div>
</div>
<label>Palette</label>
<div class="palette" id="palette"></div>
</div>
<footer>
<p>Free tool by <a href="https://toolpile.tools">ToolPile</a> — 50+ free developer & productivity tools</p>
<p style="margin-top:.5rem">Also check out: <a href="https://fakescan.site">FakeScan</a> · <a href="https://scamometer.io">Scamometer</a> · <a href="https://roastthissite.com">RoastThisSite</a></p>
</footer>
</div>
<script>
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g,b];}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};return'#'+f(0)+f(8)+f(4);}
function update(hex){
  const[r,g,b]=hexToRgb(hex);const[h,s,l]=rgbToHsl(r,g,b);
  document.getElementById('preview').style.background=hex;
  document.getElementById('hex').textContent=hex.toUpperCase();
  document.getElementById('rgb').textContent=`${r}, ${g}, ${b}`;
  document.getElementById('hsl').textContent=`${h}°, ${s}%, ${l}%`;
  const pal=document.getElementById('palette');pal.innerHTML='';
  const offsets=[0,30,60,180,210,330];
  offsets.forEach(o=>{const nh=(h+o)%360;const c=hslToHex(nh,s,l);const d=document.createElement('div');d.className='swatch';d.style.background=c;d.dataset.hex=c.toUpperCase();d.onclick=()=>{navigator.clipboard.writeText(c.toUpperCase());};pal.appendChild(d);});
}
update('#6366f1');
</script>
</body>
</html>
