<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
input[type="text"]{width:100%;background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;color:#e2e8f0;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.75rem;transition:transform .1s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.btn-secondary{background:#334155;margin-left:.5rem}
.row{display:flex;gap:.75rem;align-items:center;margin-top:.75rem;flex-wrap:wrap}
label{font-size:.875rem;color:#94a3b8;display:block;margin-bottom:.5rem;margin-top:1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1rem}
.card{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:1rem}
.card-label{font-size:.75rem;color:#94a3b8;margin-bottom:.25rem}
.card-value{font-size:1.1rem;font-weight:600;color:#38bdf8;word-break:break-all}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>IP Address Lookup</h1>
<p class="subtitle">Discover IP geolocation, ISP, and timezone information.</p>
<div class="tool-area">
<label>IP Address (leave blank for your own)</label>
<input type="text" id="ipIn" placeholder="e.g. 8.8.8.8">
<div class="row">
<button onclick="lookup()">Lookup</button>
<button class="btn-secondary" onclick="document.getElementById('ipIn').value='';lookup()">My IP</button>
</div>
<div class="grid" id="results">
<div class="card"><div class="card-label">IP Address</div><div class="card-value" id="rIP">—</div></div>
<div class="card"><div class="card-label">City</div><div class="card-value" id="rCity">—</div></div>
<div class="card"><div class="card-label">Region</div><div class="card-value" id="rRegion">—</div></div>
<div class="card"><div class="card-label">Country</div><div class="card-value" id="rCountry">—</div></div>
<div class="card"><div class="card-label">ISP / Org</div><div class="card-value" id="rISP">—</div></div>
<div class="card"><div class="card-label">Timezone</div><div class="card-value" id="rTZ">—</div></div>
</div>
</div>
<script>
async function lookup(){const ip=document.getElementById('ipIn').value.trim();const url=ip?`https://ipapi.co/${ip}/json/`:'https://ipapi.co/json/';try{const r=await fetch(url);const d=await r.json();document.getElementById('rIP').textContent=d.ip||'—';document.getElementById('rCity').textContent=d.city||'—';document.getElementById('rRegion').textContent=d.region||'—';document.getElementById('rCountry').textContent=(d.country_name||d.country)||'—';document.getElementById('rISP').textContent=d.org||'—';document.getElementById('rTZ').textContent=d.timezone||'—';}catch(e){document.getElementById('rIP').textContent='Error fetching data';}}
lookup();
</script>
<footer>

</footer>
</div>
</body>
