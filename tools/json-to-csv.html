<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
textarea,input[type="text"],input[type="number"],select{width:100%;background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;color:#e2e8f0;font-size:1rem;font-family:inherit;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
textarea{min-height:120px}
.output{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;margin-top:1rem;min-height:60px;color:#38bdf8;font-family:'JetBrains Mono',monospace,monospace;white-space:pre-wrap;word-break:break-all}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.75rem;transition:transform .1s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.btn-secondary{background:#334155;margin-left:.5rem}
.stats{display:flex;gap:1.5rem;margin-top:1rem;flex-wrap:wrap}
.stat{background:#1e293b;border-radius:8px;padding:.75rem 1rem;border:1px solid #334155;text-align:center;flex:1;min-width:100px}
.stat-value{font-size:1.5rem;font-weight:700;color:#38bdf8}
.stat-label{font-size:.75rem;color:#94a3b8;margin-top:.25rem}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
.row{display:flex;gap:.75rem;align-items:center;margin-top:.75rem;flex-wrap:wrap}
label{font-size:.875rem;color:#94a3b8;display:block;margin-bottom:.5rem;margin-top:1rem}
</style>
</head>
<body>
<div class="container">
<h1>JSON to CSV Converter</h1>
<p class="subtitle">Convert a JSON array of objects to CSV format — download ready</p>
<div class="tool-area">
<label for="inp">Paste JSON array</label>
<textarea id="inp" placeholder='[{"name":"Alice","age":30},{"name":"Bob","age":25}]'></textarea>
<div class="row">
<button onclick="convert()">Convert to CSV</button>
<button class="btn-secondary" onclick="copy()">Copy CSV</button>
<button class="btn-secondary" onclick="download()">Download .csv</button>
<button class="btn-secondary" onclick="document.getElementById('inp').value='';document.getElementById('out').textContent='';document.querySelectorAll('.stat-value').forEach(s=>s.textContent='0')">Clear</button>
</div>
<div class="stats">
<div class="stat"><div class="stat-value" id="rows">0</div><div class="stat-label">Rows</div></div>
<div class="stat"><div class="stat-value" id="cols">0</div><div class="stat-label">Columns</div></div>
</div>
<div class="output" id="out"></div>
</div>
<footer>
<p>Free tool by <a href="https://toolpile.tools">ToolPile</a> — 50+ free developer & productivity tools</p>
<p style="margin-top:.5rem">Also check out: <a href="https://fakescan.site">FakeScan</a> · <a href="https://scamometer.io">Scamometer</a> · <a href="https://roastthissite.com">RoastThisSite</a></p>
</footer>
</div>
<script>
function esc(v){const s=String(v??'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}
function convert(){
  const out=document.getElementById('out');
  try{
    let data=JSON.parse(document.getElementById('inp').value);
    if(!Array.isArray(data)){out.textContent='Error: Input must be a JSON array';return;}
    const keys=[...new Set(data.flatMap(Object.keys))];
    const header=keys.map(esc).join(',');
    const rows=data.map(r=>keys.map(k=>esc(r[k])).join(','));
    const csv=header+'\n'+rows.join('\n');
    out.textContent=csv;
    document.getElementById('rows').textContent=data.length;
    document.getElementById('cols').textContent=keys.length;
  }catch(e){out.textContent='Error: Invalid JSON — '+e.message;}
}
function copy(){const t=document.getElementById('out').textContent;if(t)navigator.clipboard.writeText(t);}
function download(){
  const t=document.getElementById('out').textContent;if(!t||t.startsWith('Error'))return;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));
  a.download='data.csv';a.click();
}
</script>
</body>
</html>
