<div class="output" id="output" style="font-size:1.25rem;text-align:center;padding:1.5rem;cursor:pointer" onclick="copyOutput()" title="Click to copy"></div>

<script>
function uuid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&0x3|0x8).toString(16);});}
function gen(n){const ids=[];for(let i=0;i<n;i++)ids.push(uuid());document.getElementById('output').textContent=ids.join('\n');}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent);}
gen(1);
</script>
