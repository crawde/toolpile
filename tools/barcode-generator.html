<body>
<div class="container">
<h1>Barcode Generator</h1>
<p class="subtitle">Generate Code 128 barcodes from text — download as PNG</p>
<div class="tool-area">
  <div class="field"><label>Text / Data</label><input type="text" id="data" placeholder="Enter text or numbers" value="ToolPile2024"></div>
  <div class="row">
    <div><label>Bar Width (px)</label><input type="number" id="barW" value="2" min="1" max="5"></div>
    <div><label>Height (px)</label><input type="number" id="barH" value="100" min="30" max="300"></div>
  </div>
  <div class="row">
    <div><label>Show Text</label>
      <select id="showText"><option value="1">Yes</option><option value="0">No</option></select>
    </div>
    <div><label>Background</label>
      <select id="bgColor"><option value="#ffffff">White</option><option value="transparent">Transparent</option></select>
    </div>
  </div>
  <button class="btn" onclick="generate()">Generate Barcode</button>

<script>
// Code 128 encoding table (Code B)
const CODE128B_START=104,CODE128_STOP=106;
const PATTERNS=[
  '11011001100','11001101100','11001100110','10010011000','10010001100',
  '10001001100','10011001000','10011000100','10001100100','11001001000',
  '11001000100','11000100100','10110011100','10011011100','10011001110',
  '10111001100','10011101100','10011100110','11001110010','11001011100',
  '11001001110','11011100100','11001110100','11100101100','11100100110',
  '11101100100','11100110100','11100110010','11011011000','11011000110',
  '11000110110','10100011000','10001011000','10001000110','10110001000',
  '10001101000','10001100010','11010001000','11000101000','11000100010',
  '10110111000','10110001110','10001101110','10111011000','10111000110',
  '10001110110','11101110110','11010001110','11000101110','11011101000',
  '11011100010','11011101110','11101011000','11101000110','11100010110',
  '11101101000','11101100010','11100011010','11101111010','11001000010',
  '11110001010','10100110000','10100001100','10010110000','10010000110',
  '10000101100','10000100110','10110010000','10110000100','10011010000',
  '10011000010','10000110100','10000110010','11000010010','11001010000',
  '11110111010','11000010100','10001111010','10100111100','10010111100',
  '10010011110','10111100100','10011110100','10011110010','11110100100',
  '11110010100','11110010010','11011011110','11011110110','11110110110',
  '10101111000','10100011110','10001011110','10111101000','10111100010',
  '11110101000','11110100010','10111011110','10111101110','11101011110',
  '11110101110','11010000100','11010010000','11010011100','1100011101011'
];

function encode128B(text){
  let codes=[CODE128B_START];
  let checksum=CODE128B_START;
  for(let i=0;i<text.length;i++){
    const code=text.charCodeAt(i)-32;
    if(code<0||code>94)continue;
    codes.push(code);
    checksum+=(i+1)*code;
  }
  codes.push(checksum%103);
  codes.push(CODE128_STOP);
  return codes.map(c=>PATTERNS[c]).join('');
}

function generate(){
  const text=document.getElementById('data').value;
  if(!text){alert('Please enter some text');return}
  const barW=parseInt(document.getElementById('barW').value)||2;
  const barH=parseInt(document.getElementById('barH').value)||100;
  const showText=document.getElementById('showText').value==='1';
  const bgColor=document.getElementById('bgColor').value;
  const bits=encode128B(text);
  const quietZone=10*barW;
  const textHeight=showText?24:0;
  const canvas=document.getElementById('canvas');
  canvas.width=bits.length*barW+quietZone*2;
  canvas.height=barH+textHeight+20;
  const ctx=canvas.getContext('2d');
  if(bgColor!=='transparent'){ctx.fillStyle=bgColor;ctx.fillRect(0,0,canvas.width,canvas.height)}else{ctx.clearRect(0,0,canvas.width,canvas.height)}
  ctx.fillStyle='#000';
  for(let i=0;i<bits.length;i++){
    if(bits[i]==='1'){ctx.fillRect(quietZone+i*barW,10,barW,barH)}
  }
  if(showText){
    ctx.fillStyle='#000';ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText(text,canvas.width/2,barH+28);
  }
  document.getElementById('preview').style.display='block';
}

function download(){
  const canvas=document.getElementById('canvas');
  const a=document.createElement('a');a.download='barcode.png';a.href=canvas.toDataURL('image/png');a.click();
}
generate();
</script>
