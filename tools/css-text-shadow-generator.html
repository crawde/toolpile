<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:860px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}

.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}

input[type="range"]{width:100%;accent-color:#818cf8}
input[type="color"]{width:40px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none}

input[type="text"]:focus,input[type="number"]:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}

button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;font-size:.875rem;font-weight:600;cursor:pointer;transition:transform .1s}

#previewText{font-size:3rem;font-weight:800;color:#e2e8f0;text-align:center;transition:text-shadow .2s}
.layer{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1rem;margin-bottom:.75rem}

<body>
<div class="container">
<h1>Text Shadow Generator</h1>
<p class="subtitle">Create CSS text shadows with multiple layers. Adjust settings visually and copy the code.</p>
<div class="tool-area">
<div class="controls-top">
<div><label>Preview Text</label><input type="text" id="previewInput" value="ToolPile" oninput="updatePreviewText()"></div>
<div style="flex:0 0 100px"><label>Font Size</label><input type="number" id="fontSize" value="48" min="12" max="120" oninput="updatePreviewText()"></div>
<div style="flex:0 0 80px"><label>Text Color</label><input type="color" id="textColor" value="#e2e8f0" oninput="updatePreviewText()"></div>
</div>
<div class="preview-area"><div id="previewText">ToolPile</div></div>
<div id="layers"></div>
<div style="display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap">
<button class="btn-sm" onclick="addLayer()">+ Add Shadow</button>
<button class="btn-sm" onclick="applyPreset('neon')">Neon</button>
<button class="btn-sm" onclick="applyPreset('retro')">Retro</button>
<button class="btn-sm" onclick="applyPreset('emboss')">Emboss</button>
<button class="btn-sm" onclick="applyPreset('fire')">Fire</button>
<button class="btn-sm" onclick="applyPreset('outline')">Outline</button>
</div>
<div class="code-box" onclick="copyCode()">
<span style="position:absolute;top:.5rem;right:.75rem;font-size:.7rem;color:#64748b">Click to copy</span>
<span id="code"></span>
</div>
</div>
<footer><a href="https://toolpile.tools">← Back to ToolPile</a> · Free tools at toolpile.tools</footer>
</div>
<script>
let shadows=[{x:2,y:2,blur:4,color:'#000000',opacity:60}];
function updatePreviewText(){
const el=document.getElementById('previewText');
el.textContent=document.getElementById('previewInput').value||'Preview';
el.style.fontSize=document.getElementById('fontSize').value+'px';
el.style.color=document.getElementById('textColor').value;
}
function addLayer(){
if(shadows.length>=6)return;
shadows.push({x:0,y:0,blur:10,color:'#818cf8',opacity:80});
render();update();
}
function removeLayer(i){
if(shadows.length<=1)return;
shadows.splice(i,1);render();update();
}
function render(){
document.getElementById('layers').innerHTML=shadows.map((s,i)=>`
<div class="layer">
<div class="layer-header"><span>Shadow ${i+1}</span>${shadows.length>1?`<button class="btn-sm btn-danger" onclick="removeLayer(${i})">Remove</button>`:''}</div>
<div class="row"><div><label>X Offset</label><input type="range" min="-50" max="50" value="${s.x}" oninput="shadows[${i}].x=+this.value;update()"></div><div class="val">${s.x}px</div></div>
<div class="row"><div><label>Y Offset</label><input type="range" min="-50" max="50" value="${s.y}" oninput="shadows[${i}].y=+this.value;update()"></div><div class="val">${s.y}px</div></div>
<div class="row"><div><label>Blur</label><input type="range" min="0" max="80" value="${s.blur}" oninput="shadows[${i}].blur=+this.value;update()"></div><div class="val">${s.blur}px</div></div>
<div class="row"><div><label>Opacity</label><input type="range" min="0" max="100" value="${s.opacity}" oninput="shadows[${i}].opacity=+this.value;update()"></div><div class="val">${s.opacity}%</div></div>
<div style="margin-top:.5rem"><input type="color" value="${s.color}" oninput="shadows[${i}].color=this.value;update()"></div>
</div>`).join('');
}
function hexToRgba(hex,op){
const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
return 'rgba('+r+','+g+','+b+','+(op/100).toFixed(2)+')';
}
function update(){
const css=shadows.map(s=>s.x+'px '+s.y+'px '+s.blur+'px '+hexToRgba(s.color,s.opacity)).join(',\n    ');
document.getElementById('previewText').style.textShadow=css.replace(/\n\s*/g,' ');
document.getElementById('code').textContent='text-shadow: '+css+';';
document.querySelectorAll('.layer').forEach((layer,i)=>{
const vals=layer.querySelectorAll('.val');
if(vals[0])vals[0].textContent=shadows[i].x+'px';
if(vals[1])vals[1].textContent=shadows[i].y+'px';
if(vals[2])vals[2].textContent=shadows[i].blur+'px';
if(vals[3])vals[3].textContent=shadows[i].opacity+'%';
});
}
function copyCode(){
navigator.clipboard.writeText(document.getElementById('code').textContent);
const el=document.getElementById('code');el.style.color='#22c55e';
setTimeout(()=>el.style.color='#38bdf8',600);
}
function applyPreset(name){
const p={
neon:[{x:0,y:0,blur:10,color:'#818cf8',opacity:100},{x:0,y:0,blur:40,color:'#818cf8',opacity:60},{x:0,y:0,blur:80,color:'#38bdf8',opacity:40}],
retro:[{x:3,y:3,blur:0,color:'#ef4444',opacity:100},{x:6,y:6,blur:0,color:'#f59e0b',opacity:100},{x:9,y:9,blur:0,color:'#22c55e',opacity:100}],
emboss:[{x:-1,y:-1,blur:1,color:'#ffffff',opacity:30},{x:1,y:1,blur:1,color:'#000000',opacity:50}],
fire:[{x:0,y:-2,blur:4,color:'#ff0000',opacity:100},{x:0,y:-4,blur:10,color:'#ff6600',opacity:80},{x:0,y:-8,blur:20,color:'#ffcc00',opacity:50}],
outline:[{x:1,y:0,blur:0,color:'#000000',opacity:100},{x:-1,y:0,blur:0,color:'#000000',opacity:100},{x:0,y:1,blur:0,color:'#000000',opacity:100},{x:0,y:-1,blur:0,color:'#000000',opacity:100}]
};
shadows=JSON.parse(JSON.stringify(p[name]||p.neon));
render();update();
}
render();update();
</script>
</body>
