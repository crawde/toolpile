<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
input[type="range"]{width:100%;accent-color:#818cf8}
.output{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;margin-top:1rem;min-height:40px;color:#38bdf8;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-all;font-size:1.1rem;text-align:center;cursor:pointer}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.75rem;transition:transform .1s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.btn-secondary{background:#334155;margin-left:.5rem}
.row{display:flex;gap:.75rem;align-items:center;margin-top:.75rem;flex-wrap:wrap}
label{font-size:.875rem;color:#94a3b8;display:block;margin-bottom:.5rem;margin-top:1rem}
.toggle{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.toggle input[type="checkbox"]{accent-color:#818cf8;width:18px;height:18px}
.strength{height:6px;border-radius:3px;margin-top:.75rem;transition:all .3s}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>

<body>
<div class="container">
<h1>Password Generator</h1>
<p class="subtitle">Generate strong, random passwords instantly.</p>
<div class="tool-area">
<label>Length: <span id="lenVal">16</span></label>
<input type="range" id="len" min="8" max="128" value="16" oninput="document.getElementById('lenVal').textContent=this.value;gen()">
<div class="toggle"><input type="checkbox" id="upper" checked onchange="gen()"><span>Uppercase (A-Z)</span></div>
<div class="toggle"><input type="checkbox" id="lower" checked onchange="gen()"><span>Lowercase (a-z)</span></div>
<div class="toggle"><input type="checkbox" id="nums" checked onchange="gen()"><span>Numbers (0-9)</span></div>
<div class="toggle"><input type="checkbox" id="syms" checked onchange="gen()"><span>Symbols (!@#$...)</span></div>
<div class="output" id="output" onclick="navigator.clipboard.writeText(this.textContent)" title="Click to copy"></div>
<div class="strength" id="str"></div>
<div class="row">
<button onclick="gen()">Generate</button>
<button class="btn-secondary" onclick="bulk()">Generate 10</button>
<button class="btn-secondary" onclick="navigator.clipboard.writeText(document.getElementById('output').textContent)">Copy</button>
</div>
<div class="output" id="bulkOut" style="display:none;font-size:.85rem;text-align:left"></div>
</div>
<script>
function gen(){const l=+document.getElementById('len').value;let c='';if(document.getElementById('upper').checked)c+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(document.getElementById('lower').checked)c+='abcdefghijklmnopqrstuvwxyz';if(document.getElementById('nums').checked)c+='0123456789';if(document.getElementById('syms').checked)c+='!@#$%^&*()_+-=[]{}|;:,.<>?';if(!c){c='abcdefghijklmnopqrstuvwxyz';}const a=new Uint32Array(l);crypto.getRandomValues(a);let p='';for(let i=0;i<l;i++)p+=c[a[i]%c.length];document.getElementById('output').textContent=p;const s=document.getElementById('str');const score=Math.min(100,(c.length*Math.log2(c.length)*l)/100*10);const clr=score<30?'#ef4444':score<60?'#f59e0b':'#22c55e';s.style.background=clr;s.style.width=Math.min(100,score)+'%';return p;}
function bulk(){const o=document.getElementById('bulkOut');o.style.display='block';const r=[];for(let i=0;i<10;i++)r.push(gen());document.getElementById('output').textContent=r[0];o.textContent=r.join('\n');}
gen();
</script>
<footer>
<p>Free tool by <a href="https://toolpile.com">ToolPile</a> — 50+ free developer & productivity tools</p>

</footer>
</div>
</body>
