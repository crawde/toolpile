<body>
<div class="container">
<h1>Image to Base64</h1>
<p class="subtitle">Convert any image to a Base64 encoded string.</p>
<div class="tool-area">
<div class="drop" id="drop" onclick="document.getElementById('fileIn').click()">
<p style="font-size:1.5rem;margin-bottom:.5rem">📁</p>
<p>Drag &amp; drop an image here or click to browse</p>
</div>
<input type="file" id="fileIn" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
<img id="preview">
<div class="stats" id="statsRow" style="display:none">
<div class="stat"><div class="stat-value" id="fSize">-</div><div class="stat-label">File Size</div></div>
<div class="stat"><div class="stat-value" id="fType">-</div><div class="stat-label">Type</div></div>
<div class="stat"><div class="stat-value" id="b64Len">-</div><div class="stat-label">Base64 Length</div></div>
</div>
<div class="output" id="output" style="display:none"></div>
<div class="row" id="btns" style="display:none">
<button onclick="navigator.clipboard.writeText(document.getElementById('output').textContent)">Copy Base64</button>
<button class="btn-secondary" onclick="navigator.clipboard.writeText('data:'+window._mime+';base64,'+document.getElementById('output').textContent)">Copy Data URI</button>
</div>
</div>
<script>
const drop=document.getElementById('drop');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
function handleFile(f){if(!f)return;window._mime=f.type;const r=new FileReader();r.onload=function(){const b64=r.result.split(',')[1];document.getElementById('output').style.display='block';document.getElementById('output').textContent=b64;document.getElementById('preview').style.display='block';document.getElementById('preview').src=r.result;document.getElementById('statsRow').style.display='flex';document.getElementById('btns').style.display='flex';document.getElementById('fSize').textContent=formatBytes(f.size);document.getElementById('fType').textContent=f.type.split('/')[1]||f.type;document.getElementById('b64Len').textContent=formatBytes(b64.length);};r.readAsDataURL(f);}
function formatBytes(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}
</script>
