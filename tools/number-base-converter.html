<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Base Converter — Binary, Octal, Hex, Decimal | ToolPile</title>
<meta name="description" content="Free number base converter. Convert between binary, octal, decimal, and hexadecimal. Supports custom bases from 2 to 36. Shows step-by-step conversion.">
<meta name="keywords" content="number base converter, binary converter, hex converter, octal converter, decimal to binary, base conversion calculator">
<meta property="og:title" content="Number Base Converter — Binary, Octal, Hex, Decimal">
<meta property="og:description" content="Convert numbers between any base (2-36). Supports binary, octal, decimal, hex. Free and instant.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/number-base-converter">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
label{display:block;font-size:.875rem;color:#94a3b8;margin-bottom:.5rem}
input,select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.75rem 1rem;color:#e2e8f0;font-size:1rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
.btn{border:none;border-radius:10px;padding:.85rem 1.5rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.3)}
.row{display:flex;gap:1rem;margin-bottom:1rem;align-items:flex-end}
.row > *{flex:1}
.field{margin-bottom:1rem}
.swap-btn{background:none;border:1px solid #334155;border-radius:50%;width:36px;height:36px;color:#818cf8;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all .2s;flex:0 0 36px}
.swap-btn:hover{background:#334155}
.result-box{margin-top:1.5rem;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.25rem}
.result-box h3{font-size:.875rem;color:#94a3b8;margin-bottom:.75rem}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem .75rem;border-bottom:1px solid #1e293b;border-radius:6px;cursor:pointer;transition:background .2s}
.result-row:hover{background:#1e293b}
.result-row:last-child{border:none}
.result-label{color:#94a3b8;font-size:.8rem;width:90px}
.result-value{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.9rem;font-weight:600;word-break:break-all;flex:1;text-align:right}
.result-value.highlight{color:#818cf8}
.copied{font-size:.65rem;color:#22c55e;margin-left:.5rem;opacity:0;transition:opacity .3s}
.copied.show{opacity:1}
.quick-btns{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.quick-btn{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:.35rem .7rem;color:#94a3b8;cursor:pointer;font-size:.75rem;transition:all .2s}
.quick-btn:hover{border-color:#818cf8;color:#818cf8}
.bit-display{margin-top:1rem;display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.bit{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:.7rem;font-weight:700;border-radius:4px}
.bit-0{background:#0f172a;color:#64748b;border:1px solid #1e293b}
.bit-1{background:rgba(129,140,248,.15);color:#818cf8;border:1px solid #818cf833}
.bit-sep{width:8px}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
@media(max-width:500px){.row{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<h1>Number Base Converter</h1>
<p class="subtitle">Convert numbers between binary, octal, decimal, hexadecimal, and custom bases</p>
<div class="tool-area">
<div class="quick-btns">
<button class="quick-btn" onclick="setNum('255',10)">255</button>
<button class="quick-btn" onclick="setNum('1024',10)">1024</button>
<button class="quick-btn" onclick="setNum('FF',16)">0xFF</button>
<button class="quick-btn" onclick="setNum('11111111',2)">8 bits</button>
<button class="quick-btn" onclick="setNum('777',8)">0o777</button>
<button class="quick-btn" onclick="setNum('DEADBEEF',16)">0xDEADBEEF</button>
<button class="quick-btn" onclick="setNum('42',10)">42</button>
</div>
<div class="row">
<div class="field"><label>Input Number</label><input type="text" id="inputNum" value="255" oninput="calc()" placeholder="Enter a number..."></div>
</div>
<div class="row">
<div class="field"><label>From Base</label><select id="fromBase" onchange="calc()">
<option value="2">Binary (2)</option><option value="8">Octal (8)</option><option value="10" selected>Decimal (10)</option><option value="16">Hexadecimal (16)</option><option value="32">Base 32</option><option value="36">Base 36</option>
</select></div>
<div style="flex:0;display:flex;align-items:center;padding-bottom:1rem"><button class="swap-btn" onclick="swapBases()">⇅</button></div>
<div class="field"><label>To Base</label><select id="toBase" onchange="calc()">
<option value="2">Binary (2)</option><option value="8">Octal (8)</option><option value="10">Decimal (10)</option><option value="16" selected>Hexadecimal (16)</option><option value="32">Base 32</option><option value="36">Base 36</option>
</select></div>
</div>
<button class="btn" onclick="calc()">Convert</button>
<div id="results" style="display:none">
<div class="result-box">
<h3>Conversions (click to copy)</h3>
<div id="allBases"></div>
</div>
<div class="result-box" id="bitBox" style="display:none">
<h3>Bit Visualization</h3>
<div class="bit-display" id="bitDisplay"></div>
</div>
</div>
</div>
</div>
<footer><a href="/">← Back to ToolPile</a></footer>
<script>
function setNum(val,base){document.getElementById('inputNum').value=val;document.getElementById('fromBase').value=base;calc();}
function swapBases(){const f=document.getElementById('fromBase'),t=document.getElementById('toBase');const tmp=f.value;f.value=t.value;t.value=tmp;calc();}
function calc(){
const input=document.getElementById('inputNum').value.trim().toUpperCase();
const fromBase=+document.getElementById('fromBase').value;
const toBase=+document.getElementById('toBase').value;
if(!input)return;
let decimal;
try{decimal=parseInt(input,fromBase);}catch(e){return;}
if(isNaN(decimal)||decimal<0)return;
const bases=[
{name:'Binary',base:2,prefix:'0b'},
{name:'Octal',base:8,prefix:'0o'},
{name:'Decimal',base:10,prefix:''},
{name:'Hexadecimal',base:16,prefix:'0x'},
{name:'Base 32',base:32,prefix:''},
{name:'Base 36',base:36,prefix:''}
];
let html='';
bases.forEach(b=>{
const val=decimal.toString(b.base).toUpperCase();
const isTarget=b.base===toBase;
html+=`<div class="result-row" onclick="copyVal('${val}',this)"><span class="result-label">${b.name}</span><span class="result-value${isTarget?' highlight':''}">${b.prefix}${val}</span><span class="copied" id="cp_${b.base}">✓</span></div>`;
});
document.getElementById('allBases').innerHTML=html;
// Bit visualization (only for numbers that fit in 32 bits)
if(decimal<=0xFFFFFFFF){
const bits=decimal.toString(2).padStart(Math.ceil(decimal.toString(2).length/8)*8,'0');
let bitHtml='';
for(let i=0;i<bits.length;i++){
if(i>0&&i%4===0)bitHtml+='<div class="bit-sep"></div>';
bitHtml+=`<div class="bit bit-${bits[i]}">${bits[i]}</div>`;
}
document.getElementById('bitDisplay').innerHTML=bitHtml;
document.getElementById('bitBox').style.display='block';
}else{document.getElementById('bitBox').style.display='none';}
document.getElementById('results').style.display='block';
}
function copyVal(val,row){
navigator.clipboard.writeText(val);
const cp=row.querySelector('.copied');cp.classList.add('show');setTimeout(()=>cp.classList.remove('show'),1000);
}
calc();
</script>
</body>
</html>
