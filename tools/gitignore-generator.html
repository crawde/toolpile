<body>
<div class="container">
<h1>.gitignore Generator</h1>
<p class="subtitle">Select your project types and generate a comprehensive .gitignore file</p>
<div class="tool-area">
  <label>Select Project Types</label>
  <div class="grid" id="grid"></div>
  <button class="btn" onclick="gen()">Generate .gitignore</button>
  <div class="result" id="output" style="display:none"><button class="copy-btn" onclick="copyCode()">Copy</button><code id="code"></code></div>
</div>

<div style="margin-top:2rem;padding:1.25rem;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,35,.04));border:1px solid rgba(245,158,11,.25);border-radius:12px;text-align:center">

<script>
const templates={

'Java':`*.class

target/
.gradle/
build/
.settings/
.project

};

const grid=document.getElementById('grid');
Object.keys(templates).forEach(name=>{
  const card=document.createElement('div');card.className='check-card';
  card.innerHTML='<div class="check-icon">✓</div><span class="check-label">'+name+'</span>';
  card.onclick=()=>{card.classList.toggle('active')};
  grid.appendChild(card);
});

function gen(){
  const selected=[];
  document.querySelectorAll('.check-card.active .check-label').forEach(el=>selected.push(el.textContent));
  if(!selected.length){alert('Please select at least one project type');return}
  let lines=['# Generated by ToolPile - https://toolpile.tools',''];
  selected.forEach(name=>{
    lines.push('# === '+name+' ===');
    lines.push(templates[name]);
    lines.push('');
  });
  document.getElementById('code').textContent=lines.join('\n');
  document.getElementById('output').style.display='block';
}
function copyCode(){navigator.clipboard.writeText(document.getElementById('code').textContent);const b=document.querySelector('.copy-btn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500)}
</script>
