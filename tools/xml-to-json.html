<body>
<div class="container">
<h1>XML to JSON Converter</h1>
<p class="subtitle">Convert XML data to JSON format instantly — handles attributes, nested elements, and arrays.</p>
<div class="tool-area">
<textarea id="input" placeholder='Paste XML here...
<person>
  <name>John</name>
  <age>30</age>
  <hobbies>
    <hobby>Reading</hobby>
    <hobby>Coding</hobby>
  </hobbies>
</person>'></textarea>
<div class="row">
<button onclick="convert()">Convert to JSON</button>
<button class="btn-secondary" onclick="copyOutput()">Copy JSON</button>
<button class="btn-secondary" onclick="loadSample()">Sample</button>
</div>
<div class="error" id="error"></div>
<div class="output" id="output"></div>
</div>
<script>
function xmlToJson(xml){
  const obj={};
  if(xml.nodeType===1){
    if(xml.attributes.length>0){
      obj['@attributes']={};
      for(let i=0;i<xml.attributes.length;i++){
        const attr=xml.attributes.item(i);
        obj['@attributes'][attr.nodeName]=attr.nodeValue;
      }
    }
  }else if(xml.nodeType===3){
    return xml.nodeValue.trim();
  }
  if(xml.hasChildNodes()){
    for(let i=0;i<xml.childNodes.length;i++){
      const item=xml.childNodes.item(i);
      const nodeName=item.nodeName;
      if(nodeName==='#text'){
        const text=item.nodeValue.trim();
        if(text){
          if(xml.childNodes.length===1)return text;
          if(!obj['#text'])obj['#text']=text;
        }
      }else{
        const value=xmlToJson(item);
        if(typeof obj[nodeName]==='undefined'){
          obj[nodeName]=value;
        }else{
          if(!Array.isArray(obj[nodeName])){
            obj[nodeName]=[obj[nodeName]];
          }
          obj[nodeName].push(value);
        }
      }
    }
  }
  return obj;
}
function convert(){
  const input=document.getElementById('input').value.trim();
  const error=document.getElementById('error');
  if(!input){error.textContent='Please enter XML.';error.style.display='block';document.getElementById('output').textContent='';return;}
  try{
    const parser=new DOMParser();
    const xmlDoc=parser.parseFromString(input,'text/xml');
    const parseError=xmlDoc.querySelector('parsererror');
    if(parseError){throw new Error(parseError.textContent.split('\n')[0]);}
    const json=xmlToJson(xmlDoc.documentElement);
    const result={};
    result[xmlDoc.documentElement.nodeName]=json;
    document.getElementById('output').textContent=JSON.stringify(result,null,2);
    error.style.display='none';
  }catch(e){
    error.textContent='XML Parse Error: '+e.message;
    error.style.display='block';
    document.getElementById('output').textContent='';
  }
}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent);}
function loadSample(){document.getElementById('input').value='<bookstore>\n  <book category="fiction">\n    <title lang="en">Harry Potter</title>\n    <author>J.K. Rowling</author>\n    <year>2005</year>\n    <price>29.99</price>\n  </book>\n  <book category="web">\n    <title lang="en">Learning XML</title>\n    <author>Erik Ray</author>\n    <year>2003</year>\n    <price>39.95</price>\n  </book>\n</bookstore>';convert();}
</script>
