<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inflation Calculator — Future Value of Money | ToolPile</title>
<meta name="description" content="Free inflation calculator. See how purchasing power changes over time. Calculate the future or past value of money with historical CPI data.">
<meta name="keywords" content="inflation calculator, purchasing power calculator, CPI calculator, future value of money, cost of living calculator">
<meta property="og:title" content="Inflation Calculator — Free Purchasing Power Tool">
<meta property="og:description" content="Calculate how inflation affects purchasing power. See future and past values of money instantly.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/inflation-calculator">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
label{display:block;font-size:.875rem;color:#94a3b8;margin-bottom:.5rem}
input,select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.75rem 1rem;color:#e2e8f0;font-size:1rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
.btn{border:none;border-radius:10px;padding:.85rem 1.5rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.3)}
.row{display:flex;gap:1rem;margin-bottom:1rem}
.row > *{flex:1}
.field{margin-bottom:1rem}
.grid{margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.25rem;text-align:center}
.card-label{font-size:.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.card-value{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card-sub{font-size:.75rem;color:#64748b;margin-top:.25rem}
.chart-area{margin-top:1.5rem;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.25rem}
canvas{width:100%!important;height:250px!important}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
@media(max-width:500px){.row{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Inflation Calculator</h1>
<p class="subtitle">See how the purchasing power of money changes over time</p>
<div class="tool-area">
<div class="row">
<div class="field"><label>Amount ($)</label><input type="number" id="amount" value="100" min="0" step="1"></div>
<div class="field"><label>Inflation Rate (%/yr)</label><input type="number" id="rate" value="3.5" min="0" max="50" step="0.1"></div>
</div>
<div class="row">
<div class="field"><label>Start Year</label><input type="number" id="startYear" value="2020" min="1900" max="2100"></div>
<div class="field"><label>End Year</label><input type="number" id="endYear" value="2030" min="1900" max="2100"></div>
</div>
<button class="btn" onclick="calc()">Calculate</button>
<div id="results" style="display:none">
<div class="grid">
<div class="card"><div class="card-label">Future Value</div><div class="card-value" id="futureVal"></div><div class="card-sub" id="futureNote"></div></div>
<div class="card"><div class="card-label">Purchasing Power</div><div class="card-value" id="purchPow"></div><div class="card-sub" id="powNote"></div></div>
<div class="card"><div class="card-label">Total Inflation</div><div class="card-value" id="totalInf"></div><div class="card-sub" id="infNote"></div></div>
<div class="card"><div class="card-label">Price Multiplier</div><div class="card-value" id="multiplier"></div><div class="card-sub" id="multNote"></div></div>
</div>
<div class="chart-area">
<canvas id="chart"></canvas>
</div>
</div>
</div>
</div>
<footer><a href="/">← Back to ToolPile</a></footer>
<script>
const fmt=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){
const amt=+document.getElementById('amount').value;
const rate=+document.getElementById('rate').value/100;
const sy=+document.getElementById('startYear').value;
const ey=+document.getElementById('endYear').value;
if(amt<=0||sy>=ey)return;
const years=ey-sy;
const mult=Math.pow(1+rate,years);
const futVal=amt*mult;
const purchPow=amt/mult;
document.getElementById('futureVal').textContent=fmt(futVal);
document.getElementById('futureNote').textContent=`${fmt(amt)} in ${sy} = ${fmt(futVal)} in ${ey}`;
document.getElementById('purchPow').textContent=fmt(purchPow);
document.getElementById('powNote').textContent=`${fmt(amt)} in ${ey} buys what ${fmt(purchPow)} bought in ${sy}`;
document.getElementById('totalInf').textContent=((mult-1)*100).toFixed(1)+'%';
document.getElementById('infNote').textContent=`Over ${years} years at ${(rate*100).toFixed(1)}%/yr`;
document.getElementById('multiplier').textContent=mult.toFixed(3)+'×';
document.getElementById('multNote').textContent=`Prices multiply by ${mult.toFixed(3)}`;
// Chart
const canvas=document.getElementById('chart');
const ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
const rect=canvas.parentElement.getBoundingClientRect();
canvas.width=rect.width*dpr;canvas.height=250*dpr;
ctx.scale(dpr,dpr);
const w=rect.width,h=250,pad={t:20,r:20,b:40,l:60};
const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
ctx.clearRect(0,0,w,h);
const data=[];for(let i=0;i<=years;i++)data.push({year:sy+i,val:amt*Math.pow(1+rate,i),pow:amt/Math.pow(1+rate,i)});
const maxV=Math.max(...data.map(d=>d.val));
const xStep=cw/years;
// grid
ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
for(let i=0;i<=4;i++){const y=pad.t+ch-(ch/4)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText(fmt(maxV/4*i),pad.l-8,y+4);}
// labels
const labelStep=Math.max(1,Math.floor(years/8));
for(let i=0;i<=years;i+=labelStep){ctx.fillStyle='#64748b';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(data[i].year,pad.l+i*xStep,h-pad.b+18);}
// future val line
ctx.beginPath();ctx.strokeStyle='#6366f1';ctx.lineWidth=2.5;
data.forEach((d,i)=>{const x=pad.l+i*xStep,y=pad.t+ch-(d.val/maxV)*ch;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
ctx.stroke();
// purchasing power line
ctx.beginPath();ctx.strokeStyle='#38bdf8';ctx.lineWidth=2.5;
data.forEach((d,i)=>{const x=pad.l+i*xStep,y=pad.t+ch-(d.pow/maxV)*ch;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
ctx.stroke();
// legend
ctx.font='12px sans-serif';
ctx.fillStyle='#6366f1';ctx.fillRect(w-180,10,12,12);ctx.fillStyle='#94a3b8';ctx.fillText('Cost to buy',w-164,20);
ctx.fillStyle='#38bdf8';ctx.fillRect(w-90,10,12,12);ctx.fillStyle='#94a3b8';ctx.fillText('Buying power',w-74,20);
document.getElementById('results').style.display='block';
}
calc();
</script>
</body>
</html>
