<body>
<div class="container">
<h1>HTML Beautifier</h1>
<p class="subtitle">Format and beautify HTML code with proper indentation and tag nesting.</p>
<div class="tool-area">
<textarea id="input" placeholder='Paste HTML here... e.g. <div><p>Hello <strong>World</strong></p></div>'></textarea>
<div class="row">
<label>Indent: <select id="indent"><option value="2" selected>2 spaces</option><option value="4">4 spaces</option><option value="tab">Tab</option></select></label>
</div>
<div class="row">
<button onclick="beautify()">Beautify HTML</button>
<button class="btn-secondary" onclick="minify()">Minify</button>
<button class="btn-secondary" onclick="copyOutput()">Copy</button>
</div>
<div class="output" id="output"></div>
</div>
<script>
const VOID_ELEMENTS=new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
const INLINE_ELEMENTS=new Set(['a','abbr','b','bdi','bdo','cite','code','data','dfn','em','i','kbd','mark','q','rp','rt','ruby','s','samp','small','span','strong','sub','sup','time','u','var','wbr']);
function beautify(){
  let html=document.getElementById('input').value;
  if(!html.trim()){document.getElementById('output').textContent='';return;}
  const indentVal=document.getElementById('indent').value;
  const indent=indentVal==='tab'?'\t':' '.repeat(parseInt(indentVal));
  // Normalize
  html=html.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  // Add newlines around tags
  html=html.replace(/>\s*</g,'>\n<');
  const lines=html.split('\n');
  let level=0;
  const result=[];
  for(let line of lines){
    line=line.trim();
    if(!line)continue;
    // Check if closing tag
    const closingMatch=line.match(/^<\/([a-zA-Z][a-zA-Z0-9]*)/);
    if(closingMatch){level=Math.max(0,level-1);}
    result.push(indent.repeat(level)+line);
    // Check if opening tag (not self-closing, not void)
    const openingMatch=line.match(/^<([a-zA-Z][a-zA-Z0-9]*)/);
    if(openingMatch&&!closingMatch){
      const tag=openingMatch[1].toLowerCase();
      const isSelfClosing=line.match(/\/\s*>$/);
      const hasClosingOnSameLine=line.includes('</'+openingMatch[1]);
      if(!VOID_ELEMENTS.has(tag)&&!isSelfClosing&&!hasClosingOnSameLine){
        level++;
      }
    }
  }
  document.getElementById('output').textContent=result.join('\n');
}
function minify(){
  let html=document.getElementById('input').value;
  html=html.replace(/\s+/g,' ').replace(/>\s+</g,'><').replace(/\s+>/g,'>').trim();
  document.getElementById('output').textContent=html;
}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent);}
</script>
