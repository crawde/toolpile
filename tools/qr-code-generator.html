function encode(text){const bytes=new TextEncoder().encode(text);const ver=bestVersion(bytes.length);const size=ver*4+17;const grid=Array.from({length:size},()=>new Uint8Array(size));const reserved=Array.from({length:size},()=>new Uint8Array(size));addFinderPatterns(grid,reserved,size);addAlignmentPatterns(grid,reserved,ver,size);addTimingPatterns(grid,reserved,size);reserved[8][8]=1;grid[8][8]=1;// dark module
const bits=encodeBits(bytes,ver);placeBits(grid,reserved,bits,size);const mask=0;applyMask(grid,reserved,size,mask);addFormatInfo(grid,size,mask);return grid;}
function bestVersion(len){for(let v=1;v<=10;v++){const cap=[0,17,32,53,78,106,134,154,192,230,271];if(len<=cap[v])return v;}return 10;}
function addFinderPatterns(g,r,s){function place(sy,sx){for(let y=-1;y<=7;y++)for(let x=-1;x<=7;x++){const py=sy+y,px=sx+x;if(py<0||py>=s||px<0||px>=s)continue;r[py][px]=1;const ring=Math.max(Math.abs(y-3),Math.abs(x-3));g[py][px]=(ring!==2&&ring!==4)?1:0;}}place(0,0);place(0,s-7);place(s-7,0);}
function addAlignmentPatterns(g,r,v,s){if(v<2)return;const pos=alignPos(v);for(const y of pos)for(const x of pos){if(r[y][x])continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){r[y+dy][x+dx]=1;g[y+dy][x+dx]=(Math.abs(dy)===2||Math.abs(dx)===2||(!dy&&!dx))?1:0;}}}
function alignPos(v){if(v===1)return[];const first=6,last=v*4+10;const count=Math.floor(v/7)+2;const step=Math.ceil((last-first)/(count-1));const pos=[first];for(let i=1;i<count;i++)pos.push(last-step*(count-1-i));return pos;}
function addTimingPatterns(g,r,s){for(let i=8;i<s-8;i++){if(!r[6][i]){r[6][i]=1;g[6][i]=i%2===0?1:0;}if(!r[i][6]){r[i][6]=1;g[i][6]=i%2===0?1:0;}}}
function encodeBits(bytes,ver){const cap=[0,19,34,55,80,108,136,156,194,232,274];const totalBytes=cap[ver];let bits='0100';const lenBits=ver<=9?8:16;bits+=bytes.length.toString(2).padStart(lenBits,'0');for(const b of bytes)bits+=b.toString(2).padStart(8,'0');bits+='0000';while(bits.length%8)bits+='0';while(bits.length/8<totalBytes){bits+='11101100';if(bits.length/8<totalBytes)bits+='00010001';}return bits;}
function placeBits(g,r,bits,s){let idx=0;for(let right=s-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<s;vert++){const upward=((Math.floor((s-1-right+(right<6?1:0))/2))%2===0);const y=upward?s-1-vert:vert;for(let dx=0;dx<=1;dx++){const x=right-dx;if(!r[y][x]){g[y][x]=idx<bits.length?+bits[idx]:0;idx++;}}}}}
function applyMask(g,r,s,m){for(let y=0;y<s;y++)for(let x=0;x<s;x++){if(r[y][x])continue;let mask=false;if(m===0)mask=(y+x)%2===0;g[y][x]^=mask?1:0;}}
function addFormatInfo(g,s,mask){const fmt=formatBits(0,mask);const positions=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];positions.forEach((p,i)=>{g[p[0]][p[1]]=(fmt>>i)&1;});const pos2=[[s-1,8],[s-2,8],[s-3,8],[s-4,8],[s-5,8],[s-6,8],[s-7,8],[8,s-8],[8,s-7],[8,s-6],[8,s-5],[8,s-4],[8,s-3],[8,s-2],[8,s-1]];pos2.forEach((p,i)=>{g[p[0]][p[1]]=(fmt>>i)&1;});}
