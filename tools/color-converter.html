<label>HEX Color</label>
<div class="row">
<input type="text" id="hex" value="#6366f1" oninput="fromHex()">
<div id="preview" style="width:60px;height:40px;border-radius:8px;background:#6366f1;border:2px solid #475569"></div>
</div>
<label>RGB</label>
<div class="output" id="rgb">rgb(99, 102, 241)</div>
<label>HSL</label>
<div class="output" id="hsl">hsl(239, 84%, 67%)</div>
<button onclick="navigator.clipboard.writeText(document.getElementById('hex').value)">Copy HEX</button>
<button class="btn-secondary" onclick="navigator.clipboard.writeText(document.getElementById('rgb').textContent)">Copy RGB</button>
<script>
function fromHex(){let h=document.getElementById('hex').value.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
if(h.length!==6)return;const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
document.getElementById('rgb').textContent='rgb('+r+', '+g+', '+b+')';
document.getElementById('preview').style.background='#'+h;
const rn=r/255,gn=g/255,bn=b/255,mx=Math.max(rn,gn,bn),mn=Math.min(rn,gn,bn),l=(mx+mn)/2;
let s=0,hue=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
if(mx===rn)hue=((gn-bn)/d+(gn<bn?6:0))/6;else if(mx===gn)hue=((bn-rn)/d+2)/6;else hue=((rn-gn)/d+4)/6;}
document.getElementById('hsl').textContent='hsl('+Math.round(hue*360)+', '+Math.round(s*100)+'%, '+Math.round(l*100)+'%)';}
fromHex();
</script>
