<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Create beautiful CSS box shadows with a visual editor. Adjust offset, blur, spread, color, and inset. Copy CSS code instantly.">

<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/box-shadow-generator">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
input[type="range"]{width:100%;accent-color:#818cf8}
input[type="color"]{width:40px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none}
label{font-size:.8rem;color:#94a3b8;display:block;margin-bottom:.25rem;margin-top:.75rem}
.preview-area{background:#f8fafc;border-radius:12px;padding:3rem;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;min-height:250px;position:relative}
.preview-box{width:200px;height:140px;background:#fff;border-radius:12px;transition:box-shadow .2s}
.bg-toggle{position:absolute;top:.75rem;right:.75rem;display:flex;gap:.25rem}
.bg-toggle button{width:24px;height:24px;border-radius:50%;border:2px solid #94a3b8;cursor:pointer}
.bg-toggle button.active{border-color:#818cf8;box-shadow:0 0 0 2px rgba(129,140,248,.3)}
.layer{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1rem;margin-bottom:.75rem}
.layer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.layer-header span{font-weight:600;font-size:.875rem}
.row{display:flex;gap:.75rem;align-items:center}
.row > div{flex:1}
.val{text-align:right;font-size:.75rem;color:#64748b;font-variant-numeric:tabular-nums;width:35px}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;font-size:.875rem;font-weight:600;cursor:pointer;transition:transform .1s}
button:hover{transform:translateY(-1px)}
.btn-sm{background:#334155;font-size:.75rem;padding:.4rem .6rem;margin:0}
.btn-danger{background:#ef4444}
.code-box{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;font-family:'SF Mono','JetBrains Mono',monospace;font-size:.8rem;color:#38bdf8;word-break:break-all;margin-top:1rem;cursor:pointer;position:relative}
.code-box:hover{border-color:#818cf8}
.chk{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.chk input{accent-color:#818cf8}
.presets{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.presets button{background:#334155;font-size:.7rem;padding:.35rem .6rem;margin:0}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Box Shadow Generator</h1>
<p class="subtitle">Create CSS box shadows with multiple layers. Adjust settings visually and copy CSS code.</p>
<div class="tool-area">
<div class="presets">
<button onclick="applyPreset('subtle')">Subtle</button>
<button onclick="applyPreset('medium')">Medium</button>
<button onclick="applyPreset('large')">Large</button>
<button onclick="applyPreset('sharp')">Sharp</button>
<button onclick="applyPreset('glow')">Glow</button>
<button onclick="applyPreset('layered')">Layered</button>
<button onclick="applyPreset('neumorphism')">Neumorphism</button>
</div>
<div class="preview-area" id="previewArea">
<div class="bg-toggle">
<button style="background:#f8fafc" class="active" onclick="setBg('#f8fafc',this)"></button>
<button style="background:#e2e8f0" onclick="setBg('#e2e8f0',this)"></button>
<button style="background:#1e293b" onclick="setBg('#1e293b',this)"></button>
<button style="background:#0f172a" onclick="setBg('#0f172a',this)"></button>
</div>
<div class="preview-box" id="previewBox"></div>
</div>
<div id="layers"></div>
<div style="display:flex;gap:.5rem;margin-top:.75rem">
<button class="btn-sm" onclick="addLayer()">+ Add Layer</button>
</div>
<div class="code-box" onclick="copyCode()">
<span style="position:absolute;top:.5rem;right:.75rem;font-size:.7rem;color:#64748b">Click to copy</span>
<span id="code"></span>
</div>
</div>
<footer>
<p>Free tool by <a href="https://toolpile.tools">ToolPile</a> — 50+ free developer & productivity tools</p>
<p style="margin-top:.5rem">Also check out: <a href="https://fakescan.site">FakeScan</a> · <a href="https://scamometer.io">Scamometer</a> · <a href="https://roastthissite.com">RoastThisSite</a></p>
</footer>
</div>
<script>
let shadows=[{x:0,y:4,blur:15,spread:-3,color:'#000000',opacity:30,inset:false}];
function setBg(c,btn){
document.getElementById('previewArea').style.background=c;
document.querySelectorAll('.bg-toggle button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(c==='#1e293b'||c==='#0f172a'){document.getElementById('previewBox').style.background='#334155';}
else{document.getElementById('previewBox').style.background='#fff';}
}
function addLayer(){
if(shadows.length>=5)return;
shadows.push({x:0,y:8,blur:25,spread:-5,color:'#000000',opacity:15,inset:false});
render();update();
}
function removeLayer(i){
if(shadows.length<=1)return;
shadows.splice(i,1);render();update();
}
function render(){
const el=document.getElementById('layers');
el.innerHTML=shadows.map((s,i)=>`
<div class="layer">
<div class="layer-header"><span>Layer ${i+1}</span>${shadows.length>1?`<button class="btn-sm btn-danger" onclick="removeLayer(${i})">Remove</button>`:''}</div>
<div class="row"><div><label>X Offset</label><input type="range" min="-50" max="50" value="${s.x}" oninput="shadows[${i}].x=+this.value;update()"></div><div class="val">${s.x}px</div></div>
<div class="row"><div><label>Y Offset</label><input type="range" min="-50" max="50" value="${s.y}" oninput="shadows[${i}].y=+this.value;update()"></div><div class="val">${s.y}px</div></div>
<div class="row"><div><label>Blur</label><input type="range" min="0" max="100" value="${s.blur}" oninput="shadows[${i}].blur=+this.value;update()"></div><div class="val">${s.blur}px</div></div>
<div class="row"><div><label>Spread</label><input type="range" min="-50" max="50" value="${s.spread}" oninput="shadows[${i}].spread=+this.value;update()"></div><div class="val">${s.spread}px</div></div>
<div class="row"><div><label>Opacity</label><input type="range" min="0" max="100" value="${s.opacity}" oninput="shadows[${i}].opacity=+this.value;update()"></div><div class="val">${s.opacity}%</div></div>
<div class="row" style="margin-top:.5rem"><input type="color" value="${s.color}" oninput="shadows[${i}].color=this.value;update()"><div class="chk"><input type="checkbox" ${s.inset?'checked':''} onchange="shadows[${i}].inset=this.checked;update()"><label style="margin:0">Inset</label></div></div>
</div>`).join('');
}
function hexToRgba(hex,op){
const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
return `rgba(${r}, ${g}, ${b}, ${(op/100).toFixed(2)})`;
}
function update(){
const css=shadows.map(s=>`${s.inset?'inset ':''}${s.x}px ${s.y}px ${s.blur}px ${s.spread}px ${hexToRgba(s.color,s.opacity)}`).join(',\n    ');
document.getElementById('previewBox').style.boxShadow=css.replace(/\n\s*/g,' ');
document.getElementById('code').textContent=`box-shadow: ${css};`;
// Update val displays
document.querySelectorAll('.layer').forEach((layer,i)=>{
const vals=layer.querySelectorAll('.val');
if(vals[0])vals[0].textContent=shadows[i].x+'px';
if(vals[1])vals[1].textContent=shadows[i].y+'px';
if(vals[2])vals[2].textContent=shadows[i].blur+'px';
if(vals[3])vals[3].textContent=shadows[i].spread+'px';
if(vals[4])vals[4].textContent=shadows[i].opacity+'%';
});
}
function copyCode(){
navigator.clipboard.writeText(document.getElementById('code').textContent);
document.getElementById('code').style.color='#22c55e';
setTimeout(()=>document.getElementById('code').style.color='#38bdf8',600);
}
function applyPreset(name){
const p={
subtle:[{x:0,y:1,blur:3,spread:0,color:'#000000',opacity:10,inset:false}],
medium:[{x:0,y:4,blur:15,spread:-3,color:'#000000',opacity:30,inset:false}],
large:[{x:0,y:25,blur:50,spread:-12,color:'#000000',opacity:40,inset:false}],
sharp:[{x:5,y:5,blur:0,spread:0,color:'#000000',opacity:20,inset:false}],
glow:[{x:0,y:0,blur:30,spread:5,color:'#6366f1',opacity:50,inset:false}],
layered:[{x:0,y:1,blur:2,spread:0,color:'#000000',opacity:5,inset:false},{x:0,y:4,blur:8,spread:0,color:'#000000',opacity:4,inset:false},{x:0,y:16,blur:32,spread:0,color:'#000000',opacity:8,inset:false}],
neumorphism:[{x:8,y:8,blur:16,spread:0,color:'#000000',opacity:15,inset:false},{x:-8,y:-8,blur:16,spread:0,color:'#ffffff',opacity:5,inset:false}]
};
shadows=JSON.parse(JSON.stringify(p[name]||p.medium));
render();update();
}
render();update();
</script>
</body>
</html>
