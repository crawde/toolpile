<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:860px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
label{font-size:.8rem;color:#94a3b8;display:block;margin-bottom:.25rem;margin-top:.75rem}
input[type="range"]{width:100%;accent-color:#818cf8}
input[type="color"]{width:40px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none}
input[type="number"]{width:100%;background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.5rem .75rem;color:#e2e8f0;font-size:.9rem}
input[type="number"]:focus{outline:none;border-color:#818cf8}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;font-size:.875rem;font-weight:600;cursor:pointer;transition:transform .1s}
button:hover{transform:translateY(-1px)}
.btn-sm{background:#334155;font-size:.75rem;padding:.4rem .6rem}
.preview-wrap{display:flex;align-items:center;justify-content:center;min-height:300px;background:#0f172a;border-radius:12px;border:1px solid #334155;margin-bottom:1.5rem;padding:2rem;position:relative}
#previewBox{background:linear-gradient(135deg,#6366f1,#38bdf8);transition:all .15s}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.corner{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.75rem}
.corner-name{font-size:.75rem;font-weight:600;color:#38bdf8;margin-bottom:.5rem}
.row{display:flex;gap:.75rem;align-items:center}
.row>div{flex:1}
.val{text-align:right;font-size:.75rem;color:#64748b;width:40px}
.dims{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.75rem;margin-bottom:1rem;align-items:end}
.code-box{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;font-family:'SF Mono','JetBrains Mono',Consolas,monospace;font-size:.8rem;color:#38bdf8;word-break:break-all;margin-top:1rem;cursor:pointer;position:relative}
.code-box:hover{border-color:#818cf8}
.link-toggle{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.link-toggle input{accent-color:#818cf8}
.link-toggle label{margin:0;font-size:.85rem;cursor:pointer}
.presets{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.presets button{background:#334155;font-size:.7rem;padding:.35rem .6rem;margin:0}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
@media(max-width:600px){.corners{grid-template-columns:1fr}.dims{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Border Radius Generator</h1>
<p class="subtitle">Create CSS border-radius visually with individual corner controls.</p>
<div class="tool-area">
<div class="presets">
<button onclick="preset(10,10,10,10)">Rounded</button>
<button onclick="preset(50,50,50,50)">Circle</button>
<button onclick="preset(30,0,30,0)">Diagonal</button>
<button onclick="preset(50,0,0,50)">Left Pill</button>
<button onclick="preset(0,50,50,0)">Right Pill</button>
<button onclick="preset(50,50,0,0)">Top Pill</button>
<button onclick="preset(0,0,0,0)">Square</button>
<button onclick="preset(20,60,20,60)">Blob</button>
</div>
<div class="preview-wrap"><div id="previewBox"></div></div>
<div class="link-toggle">
<input type="checkbox" id="linkCorners" checked onchange="syncCorners()">
<label for="linkCorners">Link all corners</label>
</div>
<div class="corners">
<div class="corner"><div class="corner-name">↖ Top Left</div><div class="row"><div><input type="range" min="0" max="100" value="12" id="tl" oninput="onCorner('tl')"></div><div class="val" id="tl-val">12%</div></div></div>
<div class="corner"><div class="corner-name">↗ Top Right</div><div class="row"><div><input type="range" min="0" max="100" value="12" id="tr" oninput="onCorner('tr')"></div><div class="val" id="tr-val">12%</div></div></div>
<div class="corner"><div class="corner-name">↙ Bottom Left</div><div class="row"><div><input type="range" min="0" max="100" value="12" id="bl" oninput="onCorner('bl')"></div><div class="val" id="bl-val">12%</div></div></div>
<div class="corner"><div class="corner-name">↘ Bottom Right</div><div class="row"><div><input type="range" min="0" max="100" value="12" id="br" oninput="onCorner('br')"></div><div class="val" id="br-val">12%</div></div></div>
</div>
<div class="dims">
<div><label>Width (px)</label><input type="number" id="bw" value="220" min="50" max="500" oninput="update()"></div>
<div><label>Height (px)</label><input type="number" id="bh" value="160" min="50" max="500" oninput="update()"></div>
<div><label>BG Color</label><input type="color" id="bgColor" value="#6366f1" oninput="update()"></div>
<div><label>Unit</label><select id="unit" onchange="update()" style="background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.5rem;color:#e2e8f0;font-size:.9rem"><option value="%">%</option><option value="px">px</option></select></div>
</div>
<div class="code-box" onclick="copyCode()">
<span style="position:absolute;top:.5rem;right:.75rem;font-size:.7rem;color:#64748b">Click to copy</span>
<span id="code"></span>
</div>
</div>
<footer><a href="https://toolpile.tools">← Back to ToolPile</a> · Free tools at toolpile.tools</footer>
</div>
<script>
const ids=['tl','tr','bl','br'];
function onCorner(id){
if(document.getElementById('linkCorners').checked){
const v=document.getElementById(id).value;
ids.forEach(c=>document.getElementById(c).value=v);
}
update();
}
function syncCorners(){
if(document.getElementById('linkCorners').checked){
const v=document.getElementById('tl').value;
ids.forEach(c=>document.getElementById(c).value=v);
update();
}
}
function update(){
const u=document.getElementById('unit').value;
const vals=ids.map(id=>{const v=document.getElementById(id).value;document.getElementById(id+'-val').textContent=v+u;return v+u;});
const w=document.getElementById('bw').value;
const h=document.getElementById('bh').value;
const bg=document.getElementById('bgColor').value;
const box=document.getElementById('previewBox');
box.style.width=w+'px';box.style.height=h+'px';
box.style.background=bg;
const br=vals.join(' ');
box.style.borderRadius=br;
const allSame=ids.every(id=>document.getElementById(id).value===document.getElementById('tl').value);
const css=allSame?'border-radius: '+vals[0]+';':'border-radius: '+br+';';
document.getElementById('code').textContent=css;
}
function preset(tl,tr,bl,br){
document.getElementById('tl').value=tl;document.getElementById('tr').value=tr;
document.getElementById('bl').value=bl;document.getElementById('br').value=br;
document.getElementById('linkCorners').checked=false;
update();
}
function copyCode(){
navigator.clipboard.writeText(document.getElementById('code').textContent);
const el=document.getElementById('code');el.style.color='#22c55e';
setTimeout(()=>el.style.color='#38bdf8',600);
}
update();
</script>
</body>
