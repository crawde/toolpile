<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy Generator — Free GDPR Compliant Generator | ToolPile</title>
<meta name="description" content="Free privacy policy generator. Create a professional privacy policy for your website or app in seconds. GDPR and CCPA compliant.">
<meta name="keywords" content="privacy policy generator, free privacy policy, GDPR privacy policy, website privacy policy, privacy policy template, CCPA compliant">
<meta property="og:title" content="Privacy Policy Generator — Free Online Tool">
<meta property="og:description" content="Generate a professional privacy policy for your website or app. Free, instant, no signup.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/privacy-policy-generator">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
label{display:block;font-size:.875rem;color:#94a3b8;margin-bottom:.5rem}
input,select,textarea{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.75rem 1rem;color:#e2e8f0;font-size:1rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
.btn{border:none;border-radius:10px;padding:.85rem 1.5rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.3)}
.btn-secondary{background:#334155;margin-top:.75rem}
.btn-secondary:hover{background:#475569;box-shadow:none;transform:none}
.row{display:flex;gap:1rem;margin-bottom:1rem}
.row > *{flex:1}
.field{margin-bottom:1rem}
.checks{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
.check{display:flex;align-items:center;gap:.4rem;font-size:.875rem;color:#94a3b8;cursor:pointer}
.check input{width:auto}
.output{margin-top:1.5rem;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.5rem;font-size:.85rem;line-height:1.8;color:#cbd5e1;white-space:pre-wrap;max-height:500px;overflow-y:auto}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Privacy Policy Generator</h1>
<p class="subtitle">Generate a professional privacy policy for your website or app</p>
<div class="tool-area">
  <div class="row">
    <div>
      <label for="siteName">Website / App Name</label>
      <input type="text" id="siteName" placeholder="e.g. My Cool App">
    </div>
    <div>
      <label for="siteUrl">Website URL</label>
      <input type="text" id="siteUrl" placeholder="e.g. https://example.com">
    </div>
  </div>
  <div class="row">
    <div>
      <label for="email">Contact Email</label>
      <input type="email" id="email" placeholder="e.g. privacy@example.com">
    </div>
    <div>
      <label for="country">Country</label>
      <input type="text" id="country" placeholder="e.g. United States">
    </div>
  </div>
  <label style="margin-bottom:.75rem">Data Collected</label>
  <div class="checks">
    <label class="check"><input type="checkbox" id="chkEmail" checked> Email</label>
    <label class="check"><input type="checkbox" id="chkName" checked> Name</label>
    <label class="check"><input type="checkbox" id="chkPayment"> Payment Info</label>
    <label class="check"><input type="checkbox" id="chkCookies" checked> Cookies</label>
    <label class="check"><input type="checkbox" id="chkAnalytics" checked> Analytics</label>
    <label class="check"><input type="checkbox" id="chkLocation"> Location</label>
    <label class="check"><input type="checkbox" id="chkUsage" checked> Usage Data</label>
  </div>
  <label style="margin-bottom:.75rem">Compliance</label>
  <div class="checks">
    <label class="check"><input type="checkbox" id="chkGdpr" checked> GDPR (EU)</label>
    <label class="check"><input type="checkbox" id="chkCcpa"> CCPA (California)</label>
    <label class="check"><input type="checkbox" id="chkChildren"> Children's Privacy (COPPA)</label>
  </div>
  <button class="btn" onclick="generate()">Generate Privacy Policy</button>
  <div id="outputWrap" style="display:none">
    <div class="output" id="output"></div>
    <button class="btn btn-secondary" onclick="copyPolicy()">Copy to Clipboard</button>
  </div>
</div>

<div style="margin-top:2rem;padding:1.25rem;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,35,.04));border:1px solid rgba(245,158,11,.25);border-radius:12px;text-align:center">
<div style="font-size:.7rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">Pro</div>
<div style="color:#e2e8f0;font-weight:600;font-size:.95rem;margin-bottom:.4rem">Need batch processing or export history?</div>
<a href="https://buy.stripe.com/8x25kCb76a8C7Sv33gfjG00" style="display:inline-block;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;border-radius:8px;padding:.55rem 1.5rem;font-size:.85rem;font-weight:700;text-decoration:none;margin-top:.25rem" onclick="typeof gtag!=='undefined'&&gtag('event','begin_checkout',{currency:'USD',items:[{item_name:'toolpile_pro'}]})">Upgrade to Pro — $4.99/mo</a>
</div>

<footer>
  <p>Free tool by <a href="https://toolpile.tools">ToolPile</a></p>
</footer>
</div>
<script>
function generate(){
  const name=document.getElementById('siteName').value||'[Your Website]';
  const url=document.getElementById('siteUrl').value||'[Your URL]';
  const email=document.getElementById('email').value||'[Your Email]';
  const country=document.getElementById('country').value||'[Your Country]';
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const collected=[];
  if(document.getElementById('chkEmail').checked)collected.push('email addresses');
  if(document.getElementById('chkName').checked)collected.push('names');
  if(document.getElementById('chkPayment').checked)collected.push('payment information');
  if(document.getElementById('chkCookies').checked)collected.push('cookies and tracking technologies');
  if(document.getElementById('chkAnalytics').checked)collected.push('analytics data');
  if(document.getElementById('chkLocation').checked)collected.push('location data');
  if(document.getElementById('chkUsage').checked)collected.push('usage data');
  const gdpr=document.getElementById('chkGdpr').checked;
  const ccpa=document.getElementById('chkCcpa').checked;
  const coppa=document.getElementById('chkChildren').checked;
  let policy=`PRIVACY POLICY

Last updated: ${date}

${name} ("we", "us", or "our") operates ${url} (the "Service"). This page informs you of our policies regarding the collection, use, and disclosure of personal data when you use our Service.

INFORMATION WE COLLECT

We collect the following types of information:
${collected.map(c=>'• '+c.charAt(0).toUpperCase()+c.slice(1)).join('\n')}

HOW WE USE YOUR INFORMATION

We use the collected data for the following purposes:
• To provide and maintain our Service
• To notify you about changes to our Service
• To provide customer support
• To gather analysis or valuable information to improve our Service
• To monitor the usage of our Service
• To detect, prevent, and address technical issues`;

  if(collected.includes('payment information')){
    policy+=`\n\nPAYMENT DATA

We use third-party payment processors to handle payments. We do not store your full credit card details on our servers. Payment data is processed securely by our payment provider in accordance with PCI-DSS standards.`;
  }

  if(collected.includes('cookies and tracking technologies')){
    policy+=`\n\nCOOKIES

We use cookies and similar tracking technologies to track activity on our Service. Cookies are files with small amounts of data that may include an anonymous unique identifier.

You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. However, if you do not accept cookies, some portions of our Service may not function properly.

Types of Cookies We Use:
• Session Cookies: To operate our Service
• Preference Cookies: To remember your preferences
• Security Cookies: For security purposes`;
    if(collected.includes('analytics data')){
      policy+=`\n• Analytics Cookies: To understand how you use our Service (e.g., Google Analytics)`;
    }
  }

  policy+=`\n\nDATA RETENTION

We will retain your personal data only for as long as is necessary for the purposes set out in this Privacy Policy. We will retain and use your data to the extent necessary to comply with our legal obligations, resolve disputes, and enforce our policies.

DATA SECURITY

The security of your data is important to us. We strive to use commercially acceptable means to protect your personal data, but no method of transmission over the Internet or method of electronic storage is 100% secure.

THIRD-PARTY SERVICES

Our Service may contain links to other sites not operated by us. We have no control over and assume no responsibility for the content, privacy policies, or practices of any third-party sites or services.`;

  if(gdpr){
    policy+=`\n\nGDPR COMPLIANCE (European Users)

If you are a resident of the European Economic Area (EEA), you have certain data protection rights under the General Data Protection Regulation:

• The right to access, update, or delete your information
• The right of rectification
• The right to object to processing
• The right of restriction
• The right to data portability
• The right to withdraw consent

To exercise these rights, please contact us at ${email}. We will respond to your request within 30 days.

Legal Basis for Processing:
• Consent: You have given consent for processing
• Contract: Processing is necessary for a contract with you
• Legitimate Interests: Processing is in our legitimate interests`;
  }

  if(ccpa){
    policy+=`\n\nCCPA COMPLIANCE (California Residents)

Under the California Consumer Privacy Act, California residents have the right to:

• Know what personal data is collected about them
• Know whether their personal data is sold or disclosed and to whom
• Say no to the sale of personal data
• Access their personal data
• Request deletion of their personal data
• Not be discriminated against for exercising their privacy rights

To exercise these rights, contact us at ${email}.`;
  }

  if(coppa){
    policy+=`\n\nCHILDREN'S PRIVACY

Our Service does not address anyone under the age of 13 ("Children"). We do not knowingly collect personally identifiable information from children under 13. If we discover that a child under 13 has provided us with personal data, we will delete such information from our servers immediately.`;
  }

  policy+=`\n\nCHANGES TO THIS PRIVACY POLICY

We may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page and updating the "Last updated" date.

We advise you to review this Privacy Policy periodically for any changes.

CONTACT US

If you have any questions about this Privacy Policy, please contact us:
• By email: ${email}
• By visiting: ${url}
• Country: ${country}`;

  document.getElementById('output').textContent=policy;
  document.getElementById('outputWrap').style.display='block';
}
function copyPolicy(){
  const text=document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.btn-secondary');
    btn.textContent='Copied!';
    setTimeout(()=>btn.textContent='Copy to Clipboard',2000);
  });
}
</script>
</body>
</html>
