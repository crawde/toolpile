<style>

<body>
<div class="container">
<h1>CSS Filter Generator</h1>
<p class="subtitle">Build CSS filter effects visually. Adjust sliders and see live results.</p>
<div class="tool-area">
<div class="preview-area"><div id="previewSample"></div></div>
<div id="sliders"></div>
<div class="actions">
<button class="btn-sm" onclick="resetAll()">Reset All</button>
<button class="btn-sm" onclick="applyPreset('vintage')">Vintage</button>
<button class="btn-sm" onclick="applyPreset('dramatic')">Dramatic</button>
<button class="btn-sm" onclick="applyPreset('muted')">Muted</button>
<button class="btn-sm" onclick="applyPreset('warm')">Warm</button>
<button class="btn-sm" onclick="applyPreset('cold')">Cold</button>
</div>
<div class="code-box" onclick="copyCode()">
<span style="position:absolute;top:.5rem;right:.75rem;font-size:.7rem;color:#64748b">Click to copy</span>
<span id="code"></span>
</div>
</div>

<div style="margin-top:2rem;padding:1.25rem;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,35,.04));border:1px solid rgba(245,158,11,.25);border-radius:12px;text-align:center">
<div style="font-size:.7rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">Pro</div>

</div>

<footer><a href="https://toolpile.tools">← Back to ToolPile</a> · Free tools at toolpile.tools</footer>
</div>
<script>
const filters=[
{name:'blur',min:0,max:20,step:0.1,def:0,unit:'px'},
{name:'brightness',min:0,max:300,step:1,def:100,unit:'%'},
{name:'contrast',min:0,max:300,step:1,def:100,unit:'%'},
{name:'grayscale',min:0,max:100,step:1,def:0,unit:'%'},
{name:'hue-rotate',min:0,max:360,step:1,def:0,unit:'deg'},
{name:'invert',min:0,max:100,step:1,def:0,unit:'%'},
{name:'opacity',min:0,max:100,step:1,def:100,unit:'%'},
{name:'saturate',min:0,max:300,step:1,def:100,unit:'%'},
{name:'sepia',min:0,max:100,step:1,def:0,unit:'%'}
];
let vals={};
function init(){
filters.forEach(f=>vals[f.name]=f.def);
renderSliders();update();
}
function renderSliders(){
document.getElementById('sliders').innerHTML=filters.map(f=>`
<div class="slider-row">
<div><label>${f.name}</label><input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${vals[f.name]}" oninput="vals['${f.name}']=+this.value;update()"></div>
<div class="val" id="val-${f.name}">${vals[f.name]}${f.unit}</div>
</div>`).join('');
}
function update(){
const parts=[];
filters.forEach(f=>{
document.getElementById('val-'+f.name).textContent=vals[f.name]+f.unit;
if(vals[f.name]!==f.def) parts.push(f.name+'('+vals[f.name]+f.unit+')');
});
const css=parts.length?parts.join(' '):'none';
document.getElementById('previewSample').style.filter=css;
document.getElementById('code').textContent='filter: '+css+';';
// sync slider values
filters.forEach(f=>{
const slider=document.querySelector('input[oninput*="\''+f.name+'\'"]');
if(slider)slider.value=vals[f.name];
});
}
function resetAll(){vals={};filters.forEach(f=>vals[f.name]=f.def);renderSliders();update();}
function applyPreset(name){
resetAll();
if(name==='vintage'){vals.sepia=40;vals.contrast=120;vals.brightness=90;vals.saturate=80;}
else if(name==='dramatic'){vals.contrast=150;vals.brightness=110;vals.saturate=130;}
else if(name==='muted'){vals.saturate=50;vals.brightness=95;vals.contrast=90;}
else if(name==='warm'){vals['hue-rotate']=15;vals.saturate=120;vals.brightness=105;}
else if(name==='cold'){vals['hue-rotate']=200;vals.saturate=80;vals.brightness=95;}
renderSliders();update();
}
function copyCode(){
navigator.clipboard.writeText(document.getElementById('code').textContent);
const el=document.getElementById('code');el.style.color='#22c55e';
setTimeout(()=>el.style.color='#38bdf8',600);
}
init();
</script>
</body>
