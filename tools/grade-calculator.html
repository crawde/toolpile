<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator — GPA & Weighted Grade | ToolPile</title>
<meta name="description" content="Free grade calculator. Calculate your weighted grade average, GPA, and what you need on your final exam. Add unlimited assignments with custom weights.">
<meta name="keywords" content="grade calculator, GPA calculator, weighted grade calculator, final grade calculator, what do I need on my final">
<meta property="og:title" content="Grade Calculator — Free Weighted GPA Tool">
<meta property="og:description" content="Calculate weighted grades, GPA, and final exam scores needed. Free and instant.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/grade-calculator">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
label{display:block;font-size:.875rem;color:#94a3b8;margin-bottom:.5rem}
input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.75rem 1rem;color:#e2e8f0;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
.btn{border:none;border-radius:10px;padding:.85rem 1.5rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.3)}
.btn-sm{padding:.5rem 1rem;font-size:.875rem;width:auto;border-radius:8px}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8;font-weight:600}
.btn-outline:hover{border-color:#818cf8;color:#818cf8;transform:none;box-shadow:none}
.btn-danger{background:#ef4444;font-size:.75rem;padding:.3rem .6rem;border-radius:6px;border:none;color:#fff;cursor:pointer}
.row{display:flex;gap:1rem;margin-bottom:1rem;align-items:flex-end}
.row > *{flex:1}
.field{margin-bottom:1rem}
.grid{margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.25rem;text-align:center}
.card-label{font-size:.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.card-value{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card-sub{font-size:.75rem;color:#64748b;margin-top:.25rem}
.grade-row{display:flex;gap:.75rem;align-items:center;padding:.75rem;background:#0f172a;border-radius:8px;margin-bottom:.5rem;border:1px solid #1e293b}
.grade-row input{padding:.5rem .75rem;font-size:.875rem}
.grade-row .name{flex:2}
.grade-row .score,.grade-row .weight{flex:1}
.letter{display:inline-block;padding:.25rem .75rem;border-radius:6px;font-weight:800;font-size:1.1rem;margin-top:.5rem}
.progress-bar{height:8px;background:#0f172a;border-radius:4px;margin-top:.75rem;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
@media(max-width:500px){.row{flex-direction:column}.grid{grid-template-columns:1fr}.grade-row{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="container">
<h1>Grade Calculator</h1>
<p class="subtitle">Calculate weighted grades and see what you need on finals</p>
<div class="tool-area">
<div id="grades"></div>
<div style="display:flex;gap:.75rem;margin:1rem 0">
<button class="btn btn-sm btn-outline" onclick="addRow()">+ Add Assignment</button>
<button class="btn btn-sm btn-outline" onclick="addRow('Exam','',40)">+ Add Exam</button>
</div>
<button class="btn" onclick="calc()">Calculate Grade</button>
<div id="results" style="display:none">
<div class="grid">
<div class="card"><div class="card-label">Weighted Average</div><div class="card-value" id="avg"></div><div class="progress-bar"><div class="progress-fill" id="avgBar"></div></div></div>
<div class="card"><div class="card-label">Letter Grade</div><div class="card-value"><span class="letter" id="letter"></span></div><div class="card-sub" id="gpa"></div></div>
<div class="card"><div class="card-label">Total Weight</div><div class="card-value" id="totalW"></div><div class="card-sub" id="wNote"></div></div>
<div class="card"><div class="card-label">Need on Remaining</div><div class="card-value" id="needed"></div><div class="card-sub">To reach 90% (A-)</div></div>
</div>
</div>
</div>
</div>
<footer><a href="/">← Back to ToolPile</a></footer>
<script>
let rowId=0;
function addRow(name='',score='',weight=''){
rowId++;
const div=document.createElement('div');div.className='grade-row';div.id='r'+rowId;
div.innerHTML=`<input class="name" placeholder="Assignment name" value="${name}"><input class="score" type="number" placeholder="Score %" value="${score}" min="0" max="200"><input class="weight" type="number" placeholder="Weight %" value="${weight}" min="0" max="100"><button class="btn-danger" onclick="this.parentElement.remove()">✕</button>`;
document.getElementById('grades').appendChild(div);
}
function getLetterGrade(pct){
if(pct>=93)return['A','4.0','#22c55e'];if(pct>=90)return['A-','3.7','#22c55e'];
if(pct>=87)return['B+','3.3','#84cc16'];if(pct>=83)return['B','3.0','#84cc16'];if(pct>=80)return['B-','2.7','#eab308'];
if(pct>=77)return['C+','2.3','#f59e0b'];if(pct>=73)return['C','2.0','#f59e0b'];if(pct>=70)return['C-','1.7','#f97316'];
if(pct>=67)return['D+','1.3','#ef4444'];if(pct>=63)return['D','1.0','#ef4444'];if(pct>=60)return['D-','0.7','#ef4444'];
return['F','0.0','#dc2626'];
}
function calc(){
const rows=document.querySelectorAll('.grade-row');
let totalWeighted=0,totalWeight=0;
rows.forEach(r=>{
const s=+r.querySelector('.score').value;
const w=+r.querySelector('.weight').value;
if(!isNaN(s)&&!isNaN(w)&&w>0&&r.querySelector('.score').value!==''){totalWeighted+=s*w;totalWeight+=w;}
});
if(totalWeight===0)return;
const avg=totalWeighted/totalWeight;
const [letter,gpa,color]=getLetterGrade(avg);
document.getElementById('avg').textContent=avg.toFixed(1)+'%';
document.getElementById('avgBar').style.width=Math.min(avg,100)+'%';
document.getElementById('avgBar').style.background=color;
document.getElementById('letter').textContent=letter;
document.getElementById('letter').style.background=color+'22';
document.getElementById('letter').style.color=color;
document.getElementById('gpa').textContent='GPA: '+gpa;
document.getElementById('totalW').textContent=totalWeight+'%';
document.getElementById('wNote').textContent=totalWeight<100?`${100-totalWeight}% remaining`:'All weight accounted for';
// What score needed on remaining weight to get 90%
const remaining=100-totalWeight;
if(remaining>0){
const needed=(90*100-totalWeighted)/remaining;
document.getElementById('needed').textContent=needed<=100?needed.toFixed(1)+'%':'Not possible';
}else{document.getElementById('needed').textContent='—';}
document.getElementById('results').style.display='block';
}
// Default rows
addRow('Homework 1','92',15);addRow('Midterm','85',25);addRow('Homework 2','88',15);addRow('Project','',20);
</script>
</body>
</html>
