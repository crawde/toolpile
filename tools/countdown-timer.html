<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer — Free Online Countdown Clock | ToolPile</title>
<meta name="description" content="Set a countdown timer for any date or duration. Watch seconds tick away with a beautiful live display. Perfect for events, deadlines, and countdowns.">
<meta name="keywords" content="countdown timer, online countdown, date countdown, event countdown, timer tool">
<meta property="og:title" content="Countdown Timer — Free Online Tool">
<meta property="og:description" content="Create a countdown to any date or set a custom duration timer with live display.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/countdown-timer">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
input[type="datetime-local"],input[type="number"],select{width:100%;background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;color:#e2e8f0;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
label{font-size:.875rem;color:#94a3b8;display:block;margin-bottom:.5rem;margin-top:1rem}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .1s}
button:hover{transform:translateY(-1px)}
.btn-secondary{background:#334155}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
.toggle{display:flex;background:#0f172a;border-radius:8px;border:1px solid #475569;overflow:hidden;margin-bottom:1rem}
.toggle button{background:none;border:none;color:#94a3b8;padding:.5rem 1rem;cursor:pointer;font-size:.875rem;flex:1;border-radius:0;margin:0;font-weight:500}
.toggle button.active{background:#334155;color:#e2e8f0}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:1.5rem;text-align:center}
.cd-unit{background:#0f172a;border-radius:12px;padding:1.25rem .5rem;border:1px solid #334155}
.cd-val{font-size:3rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
.cd-lbl{font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;margin-top:.25rem}
.row{display:flex;gap:.75rem;align-items:end}
.row > div{flex:1}
.presets{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.presets button{font-size:.75rem;padding:.4rem .75rem;margin:0;background:#334155}
.done{text-align:center;padding:2rem;font-size:1.5rem;font-weight:700;color:#22c55e;display:none}
.btn-group{display:flex;gap:.5rem;margin-top:1rem}
.btn-group button{flex:1}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Countdown Timer</h1>
<p class="subtitle">Count down to a specific date or set a custom duration timer.</p>
<div class="tool-area">
<div class="toggle" id="modeToggle">
<button class="active" onclick="setMode('date')">Count to Date</button>
<button onclick="setMode('timer')">Duration Timer</button>
</div>
<div id="dateMode">
<label>Target Date & Time</label>
<input type="datetime-local" id="targetDate">
<div class="presets">
<button onclick="presetDate('nye')">New Year's Eve</button>
<button onclick="presetDate('week')">+1 Week</button>
<button onclick="presetDate('month')">+1 Month</button>
<button onclick="presetDate('hour')">+1 Hour</button>
</div>
</div>
<div id="timerMode" style="display:none">
<div class="row">
<div><label>Hours</label><input type="number" id="tH" value="0" min="0"></div>
<div><label>Minutes</label><input type="number" id="tM" value="5" min="0" max="59"></div>
<div><label>Seconds</label><input type="number" id="tS" value="0" min="0" max="59"></div>
</div>
<div class="presets">
<button onclick="presetTimer(0,1,0)">1 min</button>
<button onclick="presetTimer(0,5,0)">5 min</button>
<button onclick="presetTimer(0,15,0)">15 min</button>
<button onclick="presetTimer(0,25,0)">25 min</button>
<button onclick="presetTimer(1,0,0)">1 hour</button>
</div>
</div>
<div class="countdown" id="display">
<div class="cd-unit"><div class="cd-val" id="dD">00</div><div class="cd-lbl">Days</div></div>
<div class="cd-unit"><div class="cd-val" id="dH">00</div><div class="cd-lbl">Hours</div></div>
<div class="cd-unit"><div class="cd-val" id="dM">00</div><div class="cd-lbl">Minutes</div></div>
<div class="cd-unit"><div class="cd-val" id="dS">00</div><div class="cd-lbl">Seconds</div></div>
</div>
<div class="done" id="doneMsg">Time's up!</div>
<div class="btn-group">
<button onclick="startCountdown()">Start</button>
<button class="btn-secondary" onclick="stopCountdown()">Stop</button>
<button class="btn-danger" onclick="resetCountdown()">Reset</button>
</div>
</div>
<footer>
<p>Free tool by <a href="https://toolpile.tools">ToolPile</a> — 50+ free developer & productivity tools</p>
<p style="margin-top:.5rem">Also check out: <a href="https://fakescan.site">FakeScan</a> · <a href="https://scamometer.io">Scamometer</a> · <a href="https://roastthissite.com">RoastThisSite</a></p>
</footer>
</div>
<script>
let mode='date',interval=null,endTime=null;
const now=new Date();
document.getElementById('targetDate').value=new Date(now.getTime()+36e5).toISOString().slice(0,16);
function setMode(m){
mode=m;
document.getElementById('dateMode').style.display=m==='date'?'':'none';
document.getElementById('timerMode').style.display=m==='timer'?'':'none';
document.querySelectorAll('#modeToggle button').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
resetCountdown();
}
function presetDate(p){
const d=new Date();
if(p==='nye')d.setFullYear(d.getFullYear()+1,0,1,0,0,0);
else if(p==='week')d.setDate(d.getDate()+7);
else if(p==='month')d.setMonth(d.getMonth()+1);
else if(p==='hour')d.setHours(d.getHours()+1);
document.getElementById('targetDate').value=d.toISOString().slice(0,16);
}
function presetTimer(h,m,s){
document.getElementById('tH').value=h;
document.getElementById('tM').value=m;
document.getElementById('tS').value=s;
}
function startCountdown(){
stopCountdown();
document.getElementById('doneMsg').style.display='none';
document.getElementById('display').style.display='';
if(mode==='date'){
endTime=new Date(document.getElementById('targetDate').value).getTime();
}else{
const h=parseInt(document.getElementById('tH').value)||0;
const m=parseInt(document.getElementById('tM').value)||0;
const s=parseInt(document.getElementById('tS').value)||0;
endTime=Date.now()+(h*3600+m*60+s)*1000;
}
tick();
interval=setInterval(tick,1000);
}
function stopCountdown(){if(interval){clearInterval(interval);interval=null;}}
function resetCountdown(){
stopCountdown();
['dD','dH','dM','dS'].forEach(id=>document.getElementById(id).textContent='00');
document.getElementById('doneMsg').style.display='none';
document.getElementById('display').style.display='';
}
function tick(){
const rem=Math.max(0,endTime-Date.now());
if(rem<=0){
stopCountdown();
['dD','dH','dM','dS'].forEach(id=>document.getElementById(id).textContent='00');
document.getElementById('doneMsg').style.display='block';
document.getElementById('display').style.display='none';
try{new Audio('data:audio/wav;base64,UklGRl9VAAALQAMAAAAAAABW'+
'b25lAAAA').play();}catch(e){}
document.title='Time\'s up! — ToolPile';
return;
}
const s=Math.floor(rem/1000);
document.getElementById('dD').textContent=String(Math.floor(s/86400)).padStart(2,'0');
document.getElementById('dH').textContent=String(Math.floor(s%86400/3600)).padStart(2,'0');
document.getElementById('dM').textContent=String(Math.floor(s%3600/60)).padStart(2,'0');
document.getElementById('dS').textContent=String(s%60).padStart(2,'0');
}
</script>
</body>
</html>
