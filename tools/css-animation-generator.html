<html lang="en">
<head>
<meta charset="UTF-8">

<meta property="og:title" content="CSS Animation Generator — Keyframe Builder">
<meta property="og:description" content="Generate CSS keyframe animations visually with presets and customizable options.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/css-animation-generator.html">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:760px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:1.5rem;border:1px solid #334155}
select,input[type="text"],input[type="number"]{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;color:#e2e8f0;font-size:1rem;width:100%}
select:focus,input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.15)}
.output{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:.75rem;margin-top:1rem;color:#38bdf8;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;font-size:.8rem}
button{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.75rem;transition:transform .1s}
button:hover{transform:translateY(-1px)}
.btn-secondary{background:#334155;margin-left:.5rem}
label{font-size:.875rem;color:#94a3b8;display:block;margin-bottom:.5rem;margin-top:1rem}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
@media(max-width:600px){.row{grid-template-columns:1fr 1fr}}
.preview-area{margin-top:1.5rem;border:1px solid #475569;border-radius:12px;height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview-box{width:80px;height:80px;background:linear-gradient(135deg,#6366f1,#818cf8);border-radius:12px}
.presets{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.preset{background:#334155;border:1px solid #475569;border-radius:6px;padding:.4rem .8rem;color:#e2e8f0;font-size:.8rem;cursor:pointer;transition:all .15s}
.preset:hover,.preset.active{background:#475569;border-color:#818cf8}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>CSS Animation Generator</h1>
<p class="subtitle">Pick an animation preset or customize — preview live and copy the CSS.</p>
<div class="tool-area">
<label style="margin-top:0">Animation Presets</label>
<div class="presets" id="presetList"></div>
<div class="row">
<div><label>Duration (s)</label><input type="number" id="dur" value="1" min="0.1" max="20" step="0.1" oninput="gen()"></div>
<div><label>Timing</label><select id="timing" onchange="gen()"><option>ease</option><option>linear</option><option>ease-in</option><option>ease-out</option><option>ease-in-out</option><option>cubic-bezier(.68,-.55,.27,1.55)</option></select></div>
<div><label>Iterations</label><select id="iter" onchange="gen()"><option>infinite</option><option>1</option><option>2</option><option>3</option><option>5</option></select></div>
</div>
<div class="row">
<div><label>Direction</label><select id="dir2" onchange="gen()"><option>normal</option><option>reverse</option><option>alternate</option><option>alternate-reverse</option></select></div>
<div><label>Fill Mode</label><select id="fill" onchange="gen()"><option>none</option><option>forwards</option><option>backwards</option><option>both</option></select></div>
<div><label>Delay (s)</label><input type="number" id="delay" value="0" min="0" max="10" step="0.1" oninput="gen()"></div>
</div>
<div class="preview-area"><div class="preview-box" id="previewBox"></div></div>
<div class="output" id="cssOut"></div>
<button onclick="navigator.clipboard.writeText(document.getElementById('cssOut').textContent)">Copy CSS</button>
<button class="btn-secondary" onclick="replay()">Replay</button>
</div>
<script>
const presets={
bounce:{name:'Bounce','0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-30px)'}},
pulse:{name:'Pulse','0%,100%':{transform:'scale(1)'},'50%':{transform:'scale(1.15)'}},
shake:{name:'Shake','0%,100%':{transform:'translateX(0)'},'25%':{transform:'translateX(-10px)'},'75%':{transform:'translateX(10px)'}},
spin:{name:'Spin','0%':{transform:'rotate(0deg)'},'100%':{transform:'rotate(360deg)'}},
fadeIn:{name:'Fade In','0%':{opacity:'0'},'100%':{opacity:'1'}},
fadeOut:{name:'Fade Out','0%':{opacity:'1'},'100%':{opacity:'0'}},
slideInLeft:{name:'Slide In Left','0%':{transform:'translateX(-100px)',opacity:'0'},'100%':{transform:'translateX(0)',opacity:'1'}},
slideInUp:{name:'Slide In Up','0%':{transform:'translateY(40px)',opacity:'0'},'100%':{transform:'translateY(0)',opacity:'1'}},
zoomIn:{name:'Zoom In','0%':{transform:'scale(0)',opacity:'0'},'100%':{transform:'scale(1)',opacity:'1'}},
flip:{name:'Flip','0%':{transform:'perspective(400px) rotateY(0)'},'100%':{transform:'perspective(400px) rotateY(360deg)'}},
swing:{name:'Swing','20%':{transform:'rotate(15deg)'},'40%':{transform:'rotate(-10deg)'},'60%':{transform:'rotate(5deg)'},'80%':{transform:'rotate(-5deg)'},'100%':{transform:'rotate(0deg)'}},
jello:{name:'Jello','0%,100%':{transform:'skewX(0) skewY(0)'},'30%':{transform:'skewX(-12.5deg) skewY(-12.5deg)'},'40%':{transform:'skewX(6.25deg) skewY(6.25deg)'},'50%':{transform:'skewX(-3.125deg) skewY(-3.125deg)'},'60%':{transform:'skewX(1.5625deg) skewY(1.5625deg)'},'70%':{transform:'skewX(-.78deg) skewY(-.78deg)'}},
};
let current='bounce';
const pl=document.getElementById('presetList');
Object.keys(presets).forEach(k=>{const d=document.createElement('div');d.className='preset'+(k===current?' active':'');d.textContent=presets[k].name;d.onclick=()=>{current=k;document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));d.classList.add('active');gen();};pl.appendChild(d);});
function gen(){
const p=presets[current];
const dur=document.getElementById('dur').value;
const timing=document.getElementById('timing').value;
const iter=document.getElementById('iter').value;
const dir=document.getElementById('dir2').value;
const fill=document.getElementById('fill').value;
const delay=document.getElementById('delay').value;
let kf='@keyframes '+current+' {\n';
Object.keys(p).forEach(k=>{if(k==='name')return;kf+='  '+k+' {\n';Object.entries(p[k]).forEach(([prop,val])=>{kf+='    '+prop+': '+val+';\n';});kf+='  }\n';});
kf+='}\n\n.element {\n  animation: '+current+' '+dur+'s '+timing+' '+delay+'s '+iter+' '+dir+' '+fill+';\n}';
document.getElementById('cssOut').textContent=kf;
const box=document.getElementById('previewBox');
box.style.animation='none';
void box.offsetWidth;
box.style.animation=current+' '+dur+'s '+timing+' '+delay+'s '+iter+' '+dir+' '+fill;
// inject keyframes
let style=document.getElementById('dynStyle');
if(!style){style=document.createElement('style');style.id='dynStyle';document.head.appendChild(style);}
let css='@keyframes '+current+'{';
Object.keys(p).forEach(k=>{if(k==='name')return;css+=k+'{';Object.entries(p[k]).forEach(([prop,val])=>{css+=prop+':'+val+';';});css+='}';});
css+='}';
style.textContent=css;
}
function replay(){const b=document.getElementById('previewBox');b.style.animation='none';void b.offsetWidth;gen();}
gen();
</script>

</footer>
</div>
</body>
</html>
