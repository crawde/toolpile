<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Color Extractor — Pick Colors from Any Image | ToolPile</title>
<meta name="description" content="Free image color extractor. Upload any image to extract its dominant color palette. Get hex, RGB, and HSL values. Download palette as CSS or JSON.">
<meta name="keywords" content="image color extractor, color picker from image, extract palette from image, dominant colors, image color palette generator">
<meta property="og:title" content="Image Color Extractor — Extract Colors from Images">
<meta property="og:description" content="Upload an image and extract its color palette. Get hex, RGB, HSL codes. Free and instant.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/image-color-extractor">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
.drop-zone{border:2px dashed #334155;border-radius:12px;padding:3rem;text-align:center;cursor:pointer;transition:all .3s}
.drop-zone:hover,.drop-zone.dragover{border-color:#818cf8;background:rgba(129,140,248,.05)}
.drop-zone p{color:#94a3b8;margin-top:.5rem}
.drop-zone .icon{font-size:2.5rem;margin-bottom:.5rem}
.preview-area{margin-top:1.5rem;display:none}
.preview-img{max-width:100%;border-radius:8px;margin-bottom:1rem}
canvas{display:none}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.75rem;margin-top:1rem}
.swatch{text-align:center;cursor:pointer;transition:transform .2s}
.swatch:hover{transform:scale(1.05)}
.swatch-color{height:80px;border-radius:8px;margin-bottom:.5rem;border:1px solid #33415533}
.swatch-hex{font-family:monospace;font-size:.8rem;font-weight:700;margin-bottom:.2rem}
.swatch-rgb{font-size:.65rem;color:#94a3b8}
.swatch-pct{font-size:.65rem;color:#64748b;margin-top:.15rem}
.copied{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#22c55e;color:#fff;padding:.75rem 1.5rem;border-radius:8px;font-weight:700;font-size:.875rem;z-index:100;pointer-events:none;animation:fadeOut .8s ease-out forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.export-row{display:flex;gap:.5rem;margin-top:1rem}
.btn-sm{background:#334155;border:none;color:#94a3b8;padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .2s}
.btn-sm:hover{background:#818cf8;color:#fff}
.count-control{display:flex;align-items:center;gap:1rem;margin-top:1rem}
.count-control label{margin:0;font-size:.8rem;color:#94a3b8}
.count-control input{width:80px;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:.4rem .5rem;color:#e2e8f0;font-size:.875rem;text-align:center}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Image Color Extractor</h1>
<p class="subtitle">Upload an image and extract its dominant color palette</p>
<div class="tool-area">
<div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
<div class="icon">🎨</div>
<p><strong>Click to upload</strong> or drag & drop an image</p>
<p style="font-size:.75rem;color:#64748b;margin-top:.25rem">PNG, JPG, WebP, SVG, GIF</p>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
<canvas id="canvas"></canvas>
<div class="preview-area" id="previewArea">
<img id="previewImg" class="preview-img">
<div class="count-control"><label>Colors to extract:</label><input type="number" id="colorCount" value="8" min="3" max="20" onchange="extractColors()"></div>
<div class="palette" id="palette"></div>
<div class="export-row">
<button class="btn-sm" onclick="exportCSS()">Copy as CSS</button>
<button class="btn-sm" onclick="exportJSON()">Copy as JSON</button>
<button class="btn-sm" onclick="exportTailwind()">Copy as Tailwind</button>
</div>
</div>
</div>
</div>
<footer><a href="/">← Back to ToolPile</a></footer>
<script>
let extractedColors=[];
const dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});
function handleFile(file){
if(!file||!file.type.startsWith('image/'))return;
const reader=new FileReader();
reader.onload=e=>{
const img=document.getElementById('previewImg');
img.src=e.target.result;
img.onload=()=>{extractColors();};
document.getElementById('previewArea').style.display='block';
};
reader.readAsDataURL(file);
}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
function extractColors(){
const img=document.getElementById('previewImg');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const scale=Math.min(200/img.naturalWidth,200/img.naturalHeight,1);
canvas.width=img.naturalWidth*scale;
canvas.height=img.naturalHeight*scale;
ctx.drawImage(img,0,0,canvas.width,canvas.height);
const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
const count=+document.getElementById('colorCount').value||8;
// Simple k-means-like quantization
const pixels=[];
for(let i=0;i<data.length;i+=4){
if(data[i+3]<128)continue; // skip transparent
pixels.push([data[i],data[i+1],data[i+2]]);
}
// Initialize centers with k-means++
const centers=[];
centers.push(pixels[Math.floor(Math.random()*pixels.length)]);
for(let c=1;c<count;c++){
let dists=pixels.map(p=>{let minD=Infinity;centers.forEach(ct=>{const d=Math.pow(p[0]-ct[0],2)+Math.pow(p[1]-ct[1],2)+Math.pow(p[2]-ct[2],2);if(d<minD)minD=d;});return minD;});
const total=dists.reduce((a,b)=>a+b,0);
let r=Math.random()*total,acc=0;
for(let i=0;i<dists.length;i++){acc+=dists[i];if(acc>=r){centers.push([...pixels[i]]);break;}}
}
// Iterate k-means
for(let iter=0;iter<10;iter++){
const clusters=Array.from({length:count},()=>[]);
pixels.forEach(p=>{
let minD=Infinity,minI=0;
centers.forEach((c,i)=>{const d=Math.pow(p[0]-c[0],2)+Math.pow(p[1]-c[1],2)+Math.pow(p[2]-c[2],2);if(d<minD){minD=d;minI=i;}});
clusters[minI].push(p);
});
clusters.forEach((cl,i)=>{
if(cl.length===0)return;
centers[i]=[Math.round(cl.reduce((a,p)=>a+p[0],0)/cl.length),Math.round(cl.reduce((a,p)=>a+p[1],0)/cl.length),Math.round(cl.reduce((a,p)=>a+p[2],0)/cl.length)];
});
}
// Count assignment
const counts=new Array(count).fill(0);
pixels.forEach(p=>{let minD=Infinity,minI=0;centers.forEach((c,i)=>{const d=Math.pow(p[0]-c[0],2)+Math.pow(p[1]-c[1],2)+Math.pow(p[2]-c[2],2);if(d<minD){minD=d;minI=i;}});counts[minI]++;});
const total=counts.reduce((a,b)=>a+b,0);
extractedColors=centers.map((c,i)=>({r:c[0],g:c[1],b:c[2],hex:rgbToHex(c[0],c[1],c[2]),hsl:rgbToHsl(c[0],c[1],c[2]),pct:((counts[i]/total)*100).toFixed(1)})).sort((a,b)=>b.pct-a.pct);
renderPalette();
}
function renderPalette(){
const palette=document.getElementById('palette');
palette.innerHTML=extractedColors.map(c=>`<div class="swatch" onclick="copyColor('${c.hex}')"><div class="swatch-color" style="background:${c.hex}"></div><div class="swatch-hex">${c.hex}</div><div class="swatch-rgb">rgb(${c.r},${c.g},${c.b})</div><div class="swatch-pct">${c.pct}%</div></div>`).join('');
}
function copyColor(hex){
navigator.clipboard.writeText(hex);
const toast=document.createElement('div');toast.className='copied';toast.textContent=`Copied ${hex}`;document.body.appendChild(toast);setTimeout(()=>toast.remove(),800);
}
function exportCSS(){
const css=':root {\n'+extractedColors.map((c,i)=>`  --color-${i+1}: ${c.hex};`).join('\n')+'\n}';
navigator.clipboard.writeText(css);showToast('CSS copied!');
}
function exportJSON(){
const json=JSON.stringify(extractedColors.map(c=>({hex:c.hex,rgb:`rgb(${c.r},${c.g},${c.b})`,hsl:`hsl(${c.hsl[0]},${c.hsl[1]}%,${c.hsl[2]}%)`,percentage:c.pct+'%'})),null,2);
navigator.clipboard.writeText(json);showToast('JSON copied!');
}
function exportTailwind(){
const tw='colors: {\n'+extractedColors.map((c,i)=>`  'custom-${i+1}': '${c.hex}',`).join('\n')+'\n}';
navigator.clipboard.writeText(tw);showToast('Tailwind config copied!');
}
function showToast(msg){const t=document.createElement('div');t.className='copied';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),800);}
</script>
</body>
</html>
