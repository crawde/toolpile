<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Font Pair Generator — Typography Combinations | ToolPile</title>
<meta name="description" content="Free font pair generator. Discover beautiful typography combinations from Google Fonts. Preview heading and body text pairings. Copy CSS or import links.">
<meta name="keywords" content="font pair generator, google fonts pairing, typography combinations, font pairing tool, best font pairings">
<meta property="og:title" content="Font Pair Generator — Beautiful Typography Combinations">
<meta property="og:description" content="Find perfect font pairings for your website. Preview live, copy CSS. Uses Google Fonts. Free.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/font-pair-generator">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
.btn{border:none;border-radius:10px;padding:.85rem 1.5rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.3)}
.pair-card{background:#0f172a;border:1px solid #334155;border-radius:12px;overflow:hidden;margin-bottom:1.5rem;cursor:pointer;transition:all .3s}
.pair-card:hover{border-color:#818cf8;transform:translateY(-2px);box-shadow:0 4px 20px rgba(129,140,248,.15)}
.pair-card.selected{border-color:#818cf8;box-shadow:0 0 0 2px rgba(129,140,248,.3)}
.pair-preview{padding:2rem;min-height:180px}
.pair-preview h2{margin-bottom:.75rem;line-height:1.2}
.pair-preview p{line-height:1.8;color:#94a3b8}
.pair-meta{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.5rem;background:#1e293b;border-top:1px solid #334155}
.pair-names{font-size:.8rem;color:#94a3b8}
.pair-names strong{color:#818cf8}
.pair-cat{font-size:.65rem;background:#334155;padding:.2rem .5rem;border-radius:4px;color:#94a3b8}
.code-box{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.25rem;margin-top:1.5rem;position:relative}
.code-box pre{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.75rem;line-height:1.6;color:#94a3b8;white-space:pre-wrap;overflow-x:auto}
.copy-btn{position:absolute;top:.75rem;right:.75rem;background:#334155;border:none;color:#94a3b8;padding:.4rem .75rem;border-radius:6px;cursor:pointer;font-size:.75rem;transition:all .2s}
.copy-btn:hover{background:#818cf8;color:#fff}
.filter-row{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-btn{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:.4rem .75rem;color:#94a3b8;cursor:pointer;font-size:.75rem;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:#818cf8;color:#818cf8;background:rgba(129,140,248,.1)}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Font Pair Generator</h1>
<p class="subtitle">Discover beautiful typography combinations from Google Fonts</p>
<div class="tool-area">
<div class="filter-row">
<button class="filter-btn active" onclick="filter('all',this)">All</button>
<button class="filter-btn" onclick="filter('modern',this)">Modern</button>
<button class="filter-btn" onclick="filter('classic',this)">Classic</button>
<button class="filter-btn" onclick="filter('playful',this)">Playful</button>
<button class="filter-btn" onclick="filter('elegant',this)">Elegant</button>
<button class="filter-btn" onclick="filter('tech',this)">Tech</button>
</div>
<button class="btn" onclick="randomPair()" style="margin-bottom:1.5rem">🎲 Random Pair</button>
<div id="pairs"></div>
<div class="code-box" id="codeBox" style="display:none">
<button class="copy-btn" onclick="copyCode()">Copy</button>
<pre id="codeOutput"></pre>
</div>
</div>
</div>
<footer><a href="/">← Back to ToolPile</a></footer>
<script>
const pairs=[
{heading:'Playfair Display',body:'Source Sans 3',cat:'elegant',hw:700,bw:400},
{heading:'Montserrat',body:'Open Sans',cat:'modern',hw:800,bw:400},
{heading:'Raleway',body:'Roboto',cat:'modern',hw:700,bw:400},
{heading:'Merriweather',body:'Lato',cat:'classic',hw:700,bw:400},
{heading:'Oswald',body:'Quattrocento',cat:'classic',hw:600,bw:400},
{heading:'Lora',body:'Open Sans',cat:'elegant',hw:700,bw:400},
{heading:'Poppins',body:'Inter',cat:'modern',hw:700,bw:400},
{heading:'DM Serif Display',body:'DM Sans',cat:'elegant',hw:400,bw:400},
{heading:'Space Grotesk',body:'Inter',cat:'tech',hw:700,bw:400},
{heading:'Abril Fatface',body:'Poppins',cat:'elegant',hw:400,bw:300},
{heading:'Bebas Neue',body:'Montserrat',cat:'modern',hw:400,bw:400},
{heading:'Pacifico',body:'Quicksand',cat:'playful',hw:400,bw:400},
{heading:'Rubik',body:'Karla',cat:'modern',hw:700,bw:400},
{heading:'Permanent Marker',body:'Open Sans',cat:'playful',hw:400,bw:400},
{heading:'Work Sans',body:'Bitter',cat:'classic',hw:700,bw:400},
{heading:'Fira Code',body:'IBM Plex Sans',cat:'tech',hw:600,bw:400},
{heading:'JetBrains Mono',body:'Inter',cat:'tech',hw:700,bw:400},
{heading:'Comfortaa',body:'Nunito',cat:'playful',hw:700,bw:400},
{heading:'Archivo Black',body:'Barlow',cat:'modern',hw:400,bw:400},
{heading:'Cormorant Garamond',body:'Proza Libre',cat:'elegant',hw:600,bw:400}
];
let currentFilter='all',selectedIdx=null;
const sampleHeading='The quick brown fox jumps over the lazy dog';
const sampleBody='Typography is the art and technique of arranging type to make written language legible, readable, and appealing when displayed. Good typography enhances the reading experience and establishes visual hierarchy.';
function loadFonts(){
const allFonts=new Set();
pairs.forEach(p=>{allFonts.add(p.heading+':wght@'+p.hw);allFonts.add(p.body+':wght@'+p.bw);});
const link=document.createElement('link');
link.rel='stylesheet';
link.href='https://fonts.googleapis.com/css2?'+[...allFonts].map(f=>'family='+f.replace(/ /g,'+')).join('&')+'&display=swap';
document.head.appendChild(link);
}
function filter(cat,btn){
currentFilter=cat;
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render();
}
function render(){
const filtered=currentFilter==='all'?pairs:pairs.filter(p=>p.cat===currentFilter);
const container=document.getElementById('pairs');
container.innerHTML=filtered.map((p,i)=>{
const realIdx=pairs.indexOf(p);
return`<div class="pair-card${selectedIdx===realIdx?' selected':''}" onclick="selectPair(${realIdx})">
<div class="pair-preview"><h2 style="font-family:'${p.heading}',serif;font-weight:${p.hw};font-size:2rem">${sampleHeading}</h2><p style="font-family:'${p.body}',sans-serif;font-weight:${p.bw}">${sampleBody}</p></div>
<div class="pair-meta"><span class="pair-names"><strong>${p.heading}</strong> + ${p.body}</span><span class="pair-cat">${p.cat}</span></div>
</div>`;
}).join('');
}
function selectPair(idx){
selectedIdx=idx;
const p=pairs[idx];
const importUrl=`https://fonts.googleapis.com/css2?family=${p.heading.replace(/ /g,'+')}:wght@${p.hw}&family=${p.body.replace(/ /g,'+')}:wght@${p.bw}&display=swap`;
const css=`/* Google Fonts Import */\n@import url('${importUrl}');\n\n/* Heading */\nh1, h2, h3 {\n  font-family: '${p.heading}', serif;\n  font-weight: ${p.hw};\n}\n\n/* Body */\nbody, p {\n  font-family: '${p.body}', sans-serif;\n  font-weight: ${p.bw};\n}`;
document.getElementById('codeOutput').textContent=css;
document.getElementById('codeBox').style.display='block';
render();
}
function randomPair(){
const filtered=currentFilter==='all'?pairs:pairs.filter(p=>p.cat===currentFilter);
const p=filtered[Math.floor(Math.random()*filtered.length)];
selectPair(pairs.indexOf(p));
document.querySelector('.pair-card.selected')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function copyCode(){
navigator.clipboard.writeText(document.getElementById('codeOutput').textContent);
const btn=document.querySelector('.copy-btn');btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1500);
}
loadFonts();
render();
</script>
</body>
</html>
