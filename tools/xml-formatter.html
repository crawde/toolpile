<style>

<body>
<div class="container">
<h1>XML Formatter</h1>
<p class="subtitle">Format, beautify, or minify XML with proper indentation.</p>
<div class="tool-area">
<label>Input XML</label>
<textarea id="input" placeholder="Paste your XML here..."><?xml version="1.0" encoding="UTF-8"?><bookstore><book category="fiction"><title lang="en">The Great Gatsby</title><author>F. Scott Fitzgerald</author><year>1925</year><price>10.99</price></book><book category="science"><title lang="en">A Brief History of Time</title><author>Stephen Hawking</author><year>1988</year><price>14.99</price></book></bookstore></textarea>
<div class="actions">
<button onclick="formatXml()">Format / Beautify</button>
<button onclick="minifyXml()">Minify</button>
<span style="display:flex;align-items:center;gap:.35rem"><label style="margin:0">Indent:</label><select id="indentSize" onchange="formatXml()"><option value="2" selected>2 spaces</option><option value="4">4 spaces</option><option value="\t">Tab</option></select></span>
<button class="btn-sm" onclick="copyOutput()">Copy Output</button>
<button class="btn-sm" onclick="loadSample()">Load Sample</button>
<button class="btn-sm" onclick="document.getElementById('input').value='';document.getElementById('output').textContent=''">Clear</button>
</div>
<label>Output</label>
<div class="output-area" id="output"></div>
<div class="info"><span id="info"></span></div>
</div>
<footer><a href="https://toolpile.tools">← Back to ToolPile</a> · Free tools at toolpile.tools</footer>
</div>
<script>
function formatXml(){
const input=document.getElementById('input').value.trim();
if(!input){document.getElementById('output').textContent='';return;}
try{
const parser=new DOMParser();
const doc=parser.parseFromString(input,'text/xml');
const errorNode=doc.querySelector('parsererror');
if(errorNode){
document.getElementById('output').innerHTML='<span class="error">XML Parse Error:\n'+escHtml(errorNode.textContent)+'</span>';
document.getElementById('info').textContent='';
return;
}
const indentVal=document.getElementById('indentSize').value;
const indent=indentVal==='\t'?'\t':' '.repeat(+indentVal);
const formatted=prettifyNode(doc,indent,'');
document.getElementById('output').textContent=formatted;
document.getElementById('info').textContent='Formatted: '+formatted.split('\n').length+' lines, '+formatted.length+' chars';
}catch(e){
document.getElementById('output').innerHTML='<span class="error">Error: '+escHtml(e.message)+'</span>';
}
}
function prettifyNode(node,indent,currentIndent){
const serializer=new XMLSerializer();
let xml=serializer.serializeToString(node);

// Remove existing whitespace between tags
xml=xml.replace(/>\s+</g,'><').trim();

let formatted='';
let depth=0;
const tokens=xml.replace(/></g,'>\n<').split('\n');

tokens.forEach(token=>{
if(token.match(/^<\//)){ // Closing tag
depth--;
formatted+=currentIndent+indent.repeat(depth)+token+'\n';
}else if(token.match(/\/>$/)||token.match(/^<\?/)||token.match(/<\/[^>]+>$/)){
// Self-closing, processing instruction, or tag with content
formatted+=currentIndent+indent.repeat(depth)+token+'\n';
}else if(token.match(/^<[^\/]/)){
// Opening tag
formatted+=currentIndent+indent.repeat(depth)+token+'\n';
depth++;
}else{
formatted+=currentIndent+indent.repeat(depth)+token+'\n';
}
});
return formatted.trimEnd();
}
function minifyXml(){
const input=document.getElementById('input').value.trim();
if(!input){document.getElementById('output').textContent='';return;}
try{
const parser=new DOMParser();
const doc=parser.parseFromString(input,'text/xml');
const errorNode=doc.querySelector('parsererror');
if(errorNode){
document.getElementById('output').innerHTML='<span class="error">XML Parse Error:\n'+escHtml(errorNode.textContent)+'</span>';
return;
}
const serializer=new XMLSerializer();
let xml=serializer.serializeToString(doc);
xml=xml.replace(/>\s+</g,'><').trim();
document.getElementById('output').textContent=xml;
document.getElementById('info').textContent='Minified: '+xml.length+' chars (saved '+(input.length-xml.length)+' chars)';
}catch(e){
document.getElementById('output').innerHTML='<span class="error">Error: '+escHtml(e.message)+'</span>';
}
}
function copyOutput(){
const text=document.getElementById('output').textContent;
if(!text)return;
navigator.clipboard.writeText(text);
document.getElementById('output').style.borderColor='#22c55e';
setTimeout(()=>document.getElementById('output').style.borderColor='#475569',600);
}
function loadSample(){
document.getElementById('input').value=`<?xml version="1.0" encoding="UTF-8"?>
<catalog>
  <product id="1" category="electronics">
    <name>Wireless Mouse</name>
    <brand>TechCo</brand>
    <price currency="USD">29.99</price>
    <specs>
      <dpi>1600</dpi>
      <connectivity>Bluetooth 5.0</connectivity>
      <battery>AA</battery>
    </specs>
    <inStock>true</inStock>
  </product>
  <product id="2" category="accessories">
    <name>USB-C Hub</name>
    <brand>ConnectPro</brand>
    <price currency="USD">49.99</price>
    <specs>
      <ports>7</ports>
      <type>USB-C to USB-A, HDMI, SD</type>
    </specs>
    <inStock>false</inStock>
  </product>
</catalog>`;
formatXml();
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
formatXml();
</script>
