const catNames=Object.keys(data);
let activeCat='all';
function init(){
const catsEl=document.getElementById('cats');
catsEl.innerHTML='<button class="active" onclick="setCat(\'all\',this)">All</button>'+
catNames.map(c=>'<button onclick="setCat(\''+c+'\',this)">'+c.split(' ')[0]+'</button>').join('');
renderEmojis();
}
function setCat(cat,btn){
activeCat=cat;
document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderEmojis();
}
function renderEmojis(){
const q=document.getElementById('search').value.toLowerCase();
const area=document.getElementById('emojiArea');
let html='';let total=0;
const cats=activeCat==='all'?catNames:[activeCat];
cats.forEach(cat=>{
let emojis=data[cat];
if(q)emojis=emojis.filter(e=>e.includes(q)||cat.toLowerCase().includes(q));
if(emojis.length===0)return;
if(activeCat==='all')html+='<div class="cat-title">'+cat+'</div>';
html+='<div class="emoji-grid">'+emojis.map(e=>'<span onclick="copyEmoji(this,\''+e+'\')">'+e+'</span>').join('')+'</div>';
total+=emojis.length;
});
area.innerHTML=html||'<p style="color:#64748b;margin-top:1rem">No emojis found.</p>';
document.getElementById('count').textContent=total+' emojis';
}
function filterEmojis(){renderEmojis();}
function copyEmoji(el,emoji){
navigator.clipboard.writeText(emoji);
const toast=document.getElementById('toast');
toast.textContent='Copied '+emoji;
toast.classList.add('show');
setTimeout(()=>toast.classList.remove('show'),800);
}
init();
</script>
