<body>
<div class="container">
<h1>Binary ↔ Hex Converter</h1>
<p class="subtitle">Convert between binary and hexadecimal. Also shows decimal and octal.</p>
<div class="tool-area">
<div class="mode-tabs">
<button class="active" id="tab-bin" onclick="setMode('bin')">Binary → Hex</button>
<button id="tab-hex" onclick="setMode('hex')">Hex → Binary</button>
</div>
<div class="section">
<label id="inputLabel">Binary Input</label>
<textarea id="input" placeholder="Enter binary (e.g. 11010110 10101011)" oninput="convert()">11010110 10101011 11110000 00001111</textarea>
</div>
<div class="section">
<label>Result</label>
<div class="output-area" id="output" onclick="copyOutput()">
<span style="position:absolute;top:.5rem;right:.75rem;font-size:.7rem;color:#64748b">Click to copy</span>
<span id="result"></span>
</div>
<div class="info" id="info"></div>
</div>
<div class="extra-conversions" id="extras"></div>
<div class="actions">
<button class="btn-sm" onclick="swapMode()">⇅ Swap Direction</button>
<button class="btn-sm" onclick="document.getElementById('input').value='';document.getElementById('result').textContent='';document.getElementById('extras').innerHTML=''">Clear</button>
<button class="btn-sm" onclick="loadSample()">Sample</button>

<script>
let mode='bin';
function setMode(m){
mode=m;
document.getElementById('tab-bin').classList.toggle('active',m==='bin');
document.getElementById('tab-hex').classList.toggle('active',m==='hex');
document.getElementById('inputLabel').textContent=m==='bin'?'Binary Input':'Hexadecimal Input';
document.getElementById('input').placeholder=m==='bin'?'Enter binary (e.g. 11010110 10101011)':'Enter hex (e.g. D6AB F00F)';
convert();
}
function swapMode(){
const out=document.getElementById('result').textContent;
if(out&&!out.startsWith('Error')){
document.getElementById('input').value=out;
setMode(mode==='bin'?'hex':'bin');
}else{
setMode(mode==='bin'?'hex':'bin');
}
}
function convert(){
const raw=document.getElementById('input').value.trim();
if(!raw){document.getElementById('result').textContent='';document.getElementById('info').textContent='';document.getElementById('extras').innerHTML='';return;}
try{
if(mode==='bin'){binToHex(raw);}
else{hexToBin(raw);}
}catch(e){
document.getElementById('result').innerHTML='<span class="error">'+e.message+'</span>';
document.getElementById('info').textContent='';
document.getElementById('extras').innerHTML='';
}
}
function binToHex(input){
const clean=input.replace(/[\s_\-]/g,'');
if(!/^[01]+$/.test(clean))throw new Error('Invalid binary — only 0 and 1 allowed');
// Pad to multiple of 4
const padded=clean.padStart(Math.ceil(clean.length/4)*4,'0');
let hex='';
for(let i=0;i<padded.length;i+=4){
hex+=parseInt(padded.substr(i,4),2).toString(16).toUpperCase();
}
// Format with spaces every 2 chars (bytes)
const formatted=hex.match(/.{1,2}/g).join(' ');
document.getElementById('result').textContent=formatted;
showExtras(clean);
document.getElementById('info').textContent=clean.length+' bits → '+hex.length+' hex digits ('+Math.ceil(clean.length/8)+' bytes)';
}
function hexToBin(input){
const clean=input.replace(/[\s_\-]/g,'').replace(/^0x/i,'');
if(!/^[0-9a-fA-F]+$/.test(clean))throw new Error('Invalid hex — only 0-9, A-F allowed');
let bin='';
for(let i=0;i<clean.length;i++){
bin+=parseInt(clean[i],16).toString(2).padStart(4,'0');
}
// Format with spaces every 8 chars (bytes)
const formatted=bin.match(/.{1,8}/g).join(' ');
document.getElementById('result').textContent=formatted;
showExtras(bin);
document.getElementById('info').textContent=clean.length+' hex digits → '+bin.length+' bits ('+Math.ceil(bin.length/8)+' bytes)';
}
function showExtras(binStr){
// Only show for reasonable sizes (up to 53 bits for JS safe integer)
const extras=document.getElementById('extras');
if(binStr.length>53){
extras.innerHTML='<div class="extra-box"><div class="lbl">Decimal</div><div class="val">(too large for precise conversion)</div></div>'+
'<div class="extra-box"><div class="lbl">Octal</div><div class="val">(too large for precise conversion)</div></div>';
return;
}
const dec=parseInt(binStr,2);
const oct=dec.toString(8);
const hex=dec.toString(16).toUpperCase();
extras.innerHTML=
'<div class="extra-box"><div class="lbl">Decimal</div><div class="val">'+dec.toLocaleString()+'</div></div>'+
'<div class="extra-box"><div class="lbl">Octal</div><div class="val">'+oct+'</div></div>';
}
function copyOutput(){
const text=document.getElementById('result').textContent;
if(!text)return;
navigator.clipboard.writeText(text);
document.getElementById('output').style.borderColor='#22c55e';
setTimeout(()=>document.getElementById('output').style.borderColor='#475569',600);
}
function loadSample(){
if(mode==='bin')document.getElementById('input').value='01001000 01100101 01101100 01101100 01101111';
else document.getElementById('input').value='48 65 6C 6C 6F';
convert();
}
convert();
</script>
