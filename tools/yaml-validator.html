<script>
// Minimal YAML validator — checks structural rules
function validate(){
const input=document.getElementById('input').value;
const out=document.getElementById('output');
if(!input.trim()){out.innerHTML='<div class="result invalid">Please enter some YAML to validate.</div>';return;}
const errors=[];
const lines=input.split('\n');
let prevIndent=0;
let inMultiline=false;
let expectIndent=false;
const indentStack=[0];
const keysByLevel={};

for(let i=0;i<lines.length;i++){
const line=lines[i];
const lineNum=i+1;
const trimmed=line.trimEnd();

// Skip empty lines and comments
if(trimmed===''||trimmed.match(/^\s*#/))continue;

const leadingSpaces=line.match(/^(\s*)/)[1];

// Check for tabs
if(leadingSpaces.includes('\t')){
errors.push({line:lineNum,msg:'Tab character found — YAML requires spaces for indentation'});
continue;
}

const indent=leadingSpaces.length;

// Check for odd indentation (warning)
if(indent%2!==0&&indent>0){
errors.push({line:lineNum,msg:'Odd indentation ('+indent+' spaces) — consider using 2-space indentation'});
}

// Check mapping key: value
const kvMatch=trimmed.match(/^-?\s*([^:]+):\s*(.*)?$/);
const listMatch=trimmed.match(/^\s*-\s+(.*)$/);

// Check for duplicate colon without space
if(trimmed.match(/^[^#"']*[a-zA-Z0-9_]:(?!\s|$|'|"|{|\[)/)){
errors.push({line:lineNum,msg:'Missing space after colon in key-value pair'});
}

// Check mismatched quotes
const singleQuotes=(trimmed.match(/'/g)||[]).length;
const doubleQuotes=(trimmed.match(/"/g)||[]).length;
if(singleQuotes%2!==0)errors.push({line:lineNum,msg:'Unmatched single quote'});
if(doubleQuotes%2!==0)errors.push({line:lineNum,msg:'Unmatched double quote'});

// Check unclosed brackets
const openBrackets=(trimmed.match(/\[/g)||[]).length;
const closeBrackets=(trimmed.match(/\]/g)||[]).length;
const openBraces=(trimmed.match(/\{/g)||[]).length;
const closeBraces=(trimmed.match(/\}/g)||[]).length;
if(openBrackets!==closeBrackets)errors.push({line:lineNum,msg:'Unmatched square brackets'});
if(openBraces!==closeBraces)errors.push({line:lineNum,msg:'Unmatched curly braces'});

// Check for trailing spaces (warning)
if(line!==line.trimEnd()&&trimmed.length>0){
errors.push({line:lineNum,msg:'Trailing whitespace detected'});
}

// Detect document markers
if(trimmed==='---'||trimmed==='...')continue;

prevIndent=indent;
}

// Check for BOM
if(input.charCodeAt(0)===0xFEFF){
errors.push({line:1,msg:'Byte Order Mark (BOM) detected — remove it for compatibility'});
}

if(errors.length===0){
out.innerHTML='<div class="result valid">✓ Valid YAML — no issues found ('+lines.length+' lines checked)</div>';
}else{
out.innerHTML='<div class="result invalid">✗ Found '+errors.length+' issue'+(errors.length>1?'s':'')+'<div class="error-list">'+
errors.map(e=>'<div class="error-item"><span class="line-num">Line '+e.line+':</span>'+escHtml(e.msg)+'</div>').join('')+
'</div></div>';
}
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadSample(type){
if(type==='valid'){
document.getElementById('input').value=`# Application Config

  replica:

    port: 5432

features:

  - analytics

  level: info
  format: json`;
}else{

}
