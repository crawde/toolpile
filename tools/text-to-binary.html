<body>
<div class="container">
<h1>Text to Binary Converter</h1>
<p class="subtitle">Convert text to binary and binary back to text — 8-bit grouped format</p>
<div class="tool-area">
<label for="txt">Text</label>
<textarea id="txt" placeholder="Type or paste text here..." oninput="toBin()"></textarea>
<label for="bin">Binary</label>
<textarea id="bin" placeholder="Or paste binary here (e.g. 01001000 01101001)..." oninput="toTxt()"></textarea>
<div class="row">
<button onclick="toBin()">Text → Binary</button>
<button onclick="toTxt()">Binary → Text</button>
<button class="btn-secondary" onclick="navigator.clipboard.writeText(document.getElementById('bin').value)">Copy Binary</button>
<button class="btn-secondary" onclick="document.getElementById('txt').value='';document.getElementById('bin').value=''">Clear</button>
</div>
</div>

<script>
function toBin(){
  const t=document.getElementById('txt').value;
  document.getElementById('bin').value=t.split('').map(c=>c.charCodeAt(0).toString(2).padStart(8,'0')).join(' ');
}
function toTxt(){
  const b=document.getElementById('bin').value.trim();
  if(!b){document.getElementById('txt').value='';return;}
  try{
    const bytes=b.replace(/[^01]/g,' ').trim().split(/\s+/);
    document.getElementById('txt').value=bytes.map(x=>String.fromCharCode(parseInt(x,2))).join('');
  }catch(e){document.getElementById('txt').value='Invalid binary';}
}
</script>
