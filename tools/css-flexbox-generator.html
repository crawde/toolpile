<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.tool-area{background:#1e293b;border-radius:12px;padding:2rem 1.5rem;border:1px solid #334155}
label{display:block;font-size:.75rem;color:#94a3b8;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.03em}
select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.6rem .75rem;color:#e2e8f0;font-size:.875rem;font-family:inherit}
select:focus{outline:none;border-color:#818cf8}
input[type=number]{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.6rem .75rem;color:#e2e8f0;font-size:.875rem;font-family:inherit}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem}
.control-group{margin-bottom:0}
.preview-box{min-height:300px;background:#0f172a;border:2px dashed #334155;border-radius:12px;padding:1rem;margin-bottom:1.5rem;transition:all .3s}
.flex-item{background:linear-gradient(135deg,#6366f1,#818cf8);border-radius:8px;padding:1rem 1.25rem;color:#fff;font-weight:700;font-size:.875rem;text-align:center;min-width:60px;transition:all .3s}
.flex-item:nth-child(2){background:linear-gradient(135deg,#38bdf8,#06b6d4)}
.flex-item:nth-child(3){background:linear-gradient(135deg,#f59e0b,#f97316)}
.flex-item:nth-child(4){background:linear-gradient(135deg,#22c55e,#10b981)}
.flex-item:nth-child(5){background:linear-gradient(135deg,#ec4899,#f43f5e)}
.flex-item:nth-child(6){background:linear-gradient(135deg,#a855f7,#7c3aed)}
.code-box{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:1.25rem;position:relative;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.8rem;line-height:1.6;white-space:pre;overflow-x:auto;color:#94a3b8}
.code-box .prop{color:#818cf8}
.code-box .val{color:#38bdf8}
.copy-btn{position:absolute;top:.75rem;right:.75rem;background:#334155;border:none;color:#94a3b8;padding:.4rem .75rem;border-radius:6px;cursor:pointer;font-size:.75rem;transition:all .2s}
.copy-btn:hover{background:#818cf8;color:#fff}
.btn-row{display:flex;gap:.5rem;margin-bottom:1rem}
.btn-sm{background:#334155;border:none;color:#94a3b8;padding:.4rem .75rem;border-radius:6px;cursor:pointer;font-size:.75rem;transition:all .2s}
.btn-sm:hover{background:#818cf8;color:#fff}
.btn-sm.active{background:#818cf8;color:#fff}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>CSS Flexbox Generator</h1>
<p class="subtitle">Build flex layouts visually and copy the CSS</p>
<div class="tool-area">
<div class="controls">
<div class="control-group"><label>Direction</label><select id="direction" onchange="update()"><option value="row">row</option><option value="row-reverse">row-reverse</option><option value="column">column</option><option value="column-reverse">column-reverse</option></select></div>
<div class="control-group"><label>Justify Content</label><select id="justify" onchange="update()"><option value="flex-start">flex-start</option><option value="center">center</option><option value="flex-end">flex-end</option><option value="space-between">space-between</option><option value="space-around">space-around</option><option value="space-evenly">space-evenly</option></select></div>
<div class="control-group"><label>Align Items</label><select id="align" onchange="update()"><option value="stretch">stretch</option><option value="flex-start">flex-start</option><option value="center">center</option><option value="flex-end">flex-end</option><option value="baseline">baseline</option></select></div>
<div class="control-group"><label>Flex Wrap</label><select id="wrap" onchange="update()"><option value="nowrap">nowrap</option><option value="wrap">wrap</option><option value="wrap-reverse">wrap-reverse</option></select></div>
<div class="control-group"><label>Align Content</label><select id="alignContent" onchange="update()"><option value="stretch">stretch</option><option value="flex-start">flex-start</option><option value="center">center</option><option value="flex-end">flex-end</option><option value="space-between">space-between</option><option value="space-around">space-around</option></select></div>
<div class="control-group"><label>Gap (px)</label><input type="number" id="gap" value="12" min="0" max="100" onchange="update()"></div>
</div>
<div class="btn-row">
<button class="btn-sm" onclick="setItems(3)">3 Items</button>
<button class="btn-sm active" onclick="setItems(4)">4 Items</button>
<button class="btn-sm" onclick="setItems(5)">5 Items</button>
<button class="btn-sm" onclick="setItems(6)">6 Items</button>
<button class="btn-sm" onclick="addItem()">+ Add</button>
<button class="btn-sm" onclick="removeItem()">− Remove</button>
</div>
<div class="preview-box" id="preview"></div>
<div class="code-box" id="code"></div>
<button class="copy-btn" onclick="copyCode()">Copy CSS</button>
</div>
</div>

<div style="margin-top:2rem;padding:1.25rem;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(251,191,35,.04));border:1px solid rgba(245,158,11,.25);border-radius:12px;text-align:center">
<div style="font-size:.7rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem">Pro</div>
<div style="color:#e2e8f0;font-weight:600;font-size:.95rem;margin-bottom:.4rem">Need batch processing or export history?</div>

</div>

<footer><a href="/">← Back to ToolPile</a></footer>
<script>
let itemCount=4;
function setItems(n){itemCount=n;document.querySelectorAll('.btn-row .btn-sm').forEach(b=>b.classList.remove('active'));update();}
function addItem(){itemCount=Math.min(itemCount+1,12);update();}
function removeItem(){itemCount=Math.max(itemCount-1,1);update();}
function update(){
const dir=document.getElementById('direction').value;
const jc=document.getElementById('justify').value;
const ai=document.getElementById('align').value;
const wrap=document.getElementById('wrap').value;
const ac=document.getElementById('alignContent').value;
const gap=document.getElementById('gap').value;
const preview=document.getElementById('preview');
preview.style.display='flex';
preview.style.flexDirection=dir;
preview.style.justifyContent=jc;
preview.style.alignItems=ai;
preview.style.flexWrap=wrap;
preview.style.alignContent=ac;
preview.style.gap=gap+'px';
preview.innerHTML='';
for(let i=1;i<=itemCount;i++){
const item=document.createElement('div');item.className='flex-item';
item.textContent='Item '+i;
if(ai==='stretch'&&(dir==='row'||dir==='row-reverse'))item.style.alignSelf='auto';
preview.appendChild(item);
}
// Generate CSS
const defaults={direction:'row',justify:'flex-start',align:'stretch',wrap:'nowrap',alignContent:'stretch',gap:'0'};
let css='.container {\n  display: flex;';
if(dir!==defaults.direction)css+=`\n  flex-direction: ${dir};`;
if(jc!==defaults.justify)css+=`\n  justify-content: ${jc};`;
if(ai!==defaults.align)css+=`\n  align-items: ${ai};`;
if(wrap!==defaults.wrap)css+=`\n  flex-wrap: ${wrap};`;
if(ac!==defaults.alignContent&&wrap!=='nowrap')css+=`\n  align-content: ${ac};`;
if(gap!=='0')css+=`\n  gap: ${gap}px;`;
css+='\n}';
document.getElementById('code').textContent=css;
}
function copyCode(){
const text=document.getElementById('code').textContent;
navigator.clipboard.writeText(text).then(()=>{
const btn=document.querySelector('.copy-btn');btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy CSS',1500);
});
}
update();
</script>
</body>
</html>
