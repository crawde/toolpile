<body>
<div class="container">
<h1>Regex Tester</h1>
<p class="subtitle">Test regular expressions with real-time match highlighting.</p>
<div class="tool-area">
<label>Pattern</label>
<input type="text" id="pattern" placeholder="e.g. (\w+)@(\w+)\.(\w+)" oninput="test()">
<div class="flags">
<label><input type="checkbox" id="fg" checked onchange="test()"> g (global)</label>
<label><input type="checkbox" id="fi" onchange="test()"> i (case-insensitive)</label>
<label><input type="checkbox" id="fm" onchange="test()"> m (multiline)</label>
</div>
<label>Test String</label>
<textarea id="testStr" placeholder="Enter text to test against..." oninput="test()">user@example.com and admin@site.org</textarea>
<label>Matches</label>
<div class="output" id="output"></div>
<div class="match-info" id="groups"></div>
</div>
<script>
function test(){const p=document.getElementById('pattern').value;const s=document.getElementById('testStr').value;const out=document.getElementById('output');const grp=document.getElementById('groups');if(!p){out.innerHTML=escHtml(s);grp.textContent='Enter a pattern above';return;}
let flags='';if(document.getElementById('fg').checked)flags+='g';if(document.getElementById('fi').checked)flags+='i';if(document.getElementById('fm').checked)flags+='m';
try{const re=new RegExp(p,flags);const matches=[...s.matchAll(new RegExp(p,flags.includes('g')?flags:flags+'g'))];if(!matches.length){out.innerHTML=escHtml(s);grp.textContent='No matches found';return;}
let html='',last=0;const allMatches=[];for(const m of matches){html+=escHtml(s.slice(last,m.index));html+=`<mark>${escHtml(m[0])}</mark>`;last=m.index+m[0].length;const info=[`Match: "${m[0]}" at index ${m.index}`];for(let i=1;i<m.length;i++)info.push(`  Group ${i}: "${m[i]}"`);allMatches.push(info.join('\n'));}
html+=escHtml(s.slice(last));out.innerHTML=html;grp.textContent=`${matches.length} match${matches.length>1?'es':''} found\n\n${allMatches.join('\n\n')}`;}
catch(e){out.innerHTML=escHtml(s);grp.innerHTML=`<span class="error">Invalid regex: ${escHtml(e.message)}</span>`;}}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
test();
</script>
