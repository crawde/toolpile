<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Resolution Checker — Display Info Tool | ToolPile</title>
<meta name="description" content="Free screen resolution checker. Instantly see your screen resolution, pixel ratio, viewport size, color depth, and device info. Test responsive breakpoints.">
<meta name="keywords" content="screen resolution checker, display info, viewport size, pixel ratio, screen size test, responsive design tester">
<meta property="og:title" content="Screen Resolution Checker — Free Display Info Tool">
<meta property="og:description" content="Check your screen resolution, pixel ratio, viewport, and display properties. Free and instant.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://toolpile.tools/tools/screen-resolution-checker">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.subtitle{color:#94a3b8;font-size:1rem;margin-bottom:2rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:1.25rem;text-align:center}
.card-label{font-size:.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.card-value{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card-sub{font-size:.75rem;color:#64748b;margin-top:.25rem}
.card.full{grid-column:1/-1}
.detail-list{margin-top:1.5rem;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:1.25rem}
.detail-list h3{font-size:.875rem;color:#94a3b8;margin-bottom:.75rem}
.detail-item{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #0f172a}
.detail-item:last-child{border:none}
.detail-item span:first-child{color:#94a3b8}
.detail-item span:last-child{font-weight:600}
.breakpoint-bar{margin-top:1.5rem;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:1.25rem}
.breakpoint-bar h3{font-size:.875rem;color:#94a3b8;margin-bottom:.75rem}
.bp-row{display:flex;align-items:center;gap:.75rem;padding:.4rem 0}
.bp-label{width:80px;font-size:.8rem;color:#94a3b8}
.bp-bar{flex:1;height:20px;background:#0f172a;border-radius:4px;position:relative;overflow:hidden}
.bp-fill{height:100%;border-radius:4px;transition:width .5s}
.bp-marker{position:absolute;top:0;bottom:0;width:2px;background:#f59e0b;z-index:1}
.bp-size{width:60px;text-align:right;font-size:.75rem;color:#64748b}
.badge{display:inline-block;padding:.2rem .5rem;border-radius:4px;font-size:.7rem;font-weight:700;margin-left:.5rem}
.live-box{margin-top:1.5rem;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:1.25rem;text-align:center}
.live-box h3{font-size:.875rem;color:#94a3b8;margin-bottom:.75rem}
.live-val{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
footer{text-align:center;padding:2rem 0;color:#64748b;font-size:.875rem}
footer a{color:#818cf8;text-decoration:none}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Screen Resolution Checker</h1>
<p class="subtitle">Instantly check your display properties and viewport info</p>
<div class="grid">
<div class="card"><div class="card-label">Screen Resolution</div><div class="card-value" id="screenRes"></div><div class="card-sub">Physical pixels</div></div>
<div class="card"><div class="card-label">Viewport Size</div><div class="card-value" id="viewport"></div><div class="card-sub">CSS pixels</div></div>
<div class="card"><div class="card-label">Device Pixel Ratio</div><div class="card-value" id="dpr"></div><div class="card-sub" id="dprNote"></div></div>
<div class="card"><div class="card-label">Color Depth</div><div class="card-value" id="colorDepth"></div><div class="card-sub" id="colorNote"></div></div>
<div class="card"><div class="card-label">Aspect Ratio</div><div class="card-value" id="aspect"></div><div class="card-sub" id="aspectNote"></div></div>
<div class="card"><div class="card-label">Orientation</div><div class="card-value" id="orient"></div><div class="card-sub" id="orientNote"></div></div>
</div>
<div class="live-box">
<h3>Live Viewport (resize your browser)</h3>
<div class="live-val" id="liveSize"></div>
</div>
<div class="breakpoint-bar">
<h3>CSS Breakpoints</h3>
<div id="breakpoints"></div>
</div>
<div class="detail-list">
<h3>Full Display Info</h3>
<div id="details"></div>
</div>
</div>
<footer><a href="/">← Back to ToolPile</a></footer>
<script>
function gcd(a,b){return b?gcd(b,a%b):a;}
function detect(){
const sw=screen.width,sh=screen.height;
const vw=window.innerWidth,vh=window.innerHeight;
const dpr=window.devicePixelRatio||1;
const cd=screen.colorDepth;
document.getElementById('screenRes').textContent=`${sw} × ${sh}`;
document.getElementById('viewport').textContent=`${vw} × ${vh}`;
document.getElementById('dpr').textContent=dpr+'×';
document.getElementById('dprNote').textContent=dpr>1?`Retina/HiDPI (${sw*dpr} physical)`:'Standard density';
document.getElementById('colorDepth').textContent=cd+'-bit';
document.getElementById('colorNote').textContent=cd>=24?`${Math.pow(2,cd).toLocaleString()} colors`:'Limited colors';
const g=gcd(sw,sh);
document.getElementById('aspect').textContent=`${sw/g}:${sh/g}`;
const common={'16:9':'Widescreen','16:10':'Widescreen','21:9':'Ultrawide','4:3':'Classic','3:2':'Surface/Chromebook','5:4':'Old LCD'};
document.getElementById('aspectNote').textContent=common[`${sw/g}:${sh/g}`]||'Custom ratio';
const landscape=vw>vh;
document.getElementById('orient').textContent=landscape?'Landscape':'Portrait';
document.getElementById('orientNote').textContent=`${landscape?'Wider':'Taller'} than ${landscape?'tall':'wide'}`;
document.getElementById('liveSize').textContent=`${vw} × ${vh}`;
// Breakpoints
const bps=[{name:'xs',max:640,color:'#ef4444'},{name:'sm',max:768,color:'#f59e0b'},{name:'md',max:1024,color:'#22c55e'},{name:'lg',max:1280,color:'#38bdf8'},{name:'xl',max:1536,color:'#818cf8'},{name:'2xl',max:1920,color:'#6366f1'}];
const maxBp=1920;
document.getElementById('breakpoints').innerHTML=bps.map(bp=>{
const active=vw<=bp.max;
const pct=Math.min(bp.max/maxBp*100,100);
const markerPct=Math.min(vw/maxBp*100,100);
return`<div class="bp-row"><span class="bp-label">${bp.name}${vw<=bp.max&&(bps.indexOf(bp)===0||vw>bps[bps.indexOf(bp)-1].max)?'<span class="badge" style="background:'+bp.color+'22;color:'+bp.color+'">YOU</span>':''}</span><div class="bp-bar"><div class="bp-fill" style="width:${pct}%;background:${bp.color}22;border:1px solid ${bp.color}44"></div><div class="bp-marker" style="left:${markerPct}%"></div></div><span class="bp-size">${bp.max}px</span></div>`;
}).join('');
// Details
const details=[
['Available Width',screen.availWidth+'px'],
['Available Height',screen.availHeight+'px'],
['Page Width',document.documentElement.scrollWidth+'px'],
['Page Height',document.documentElement.scrollHeight+'px'],
['Touch Support','ontouchstart' in window?'Yes':'No'],
['Max Touch Points',navigator.maxTouchPoints||0],
['Platform',navigator.platform||'Unknown'],
['Language',navigator.language],
['Online',navigator.onLine?'Yes':'No'],
['Cookies Enabled',navigator.cookieEnabled?'Yes':'No'],
['Hardware Concurrency',(navigator.hardwareConcurrency||'Unknown')+' cores'],
['Device Memory',(navigator.deviceMemory||'Unknown')+' GB']
];
document.getElementById('details').innerHTML=details.map(([k,v])=>`<div class="detail-item"><span>${k}</span><span>${v}</span></div>`).join('');
}
detect();
window.addEventListener('resize',()=>{
document.getElementById('liveSize').textContent=`${window.innerWidth} × ${window.innerHeight}`;
detect();
});
</script>
</body>
</html>
